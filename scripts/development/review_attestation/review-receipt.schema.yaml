# c2pro-review-receipt-v1 -- AUDIT_ONLY, NOT CANONICAL (#1009, DEV-14 #991).
# Shape of an independent-agent review receipt. It grants no authority: the canonical
# review policy (.c2pro/control/review-policy.yaml) is unchanged and nothing enforces it.
$schema: https://json-schema.org/draft/2020-12/schema
$id: c2pro-review-receipt-v1
type: object
additionalProperties: false
required: [schema, schema_version, receipt_id, work_id, risk_class, subject, review, result, issued_at]
$defs:
  sha40: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  hex64: {type: string, pattern: '^[0-9a-f]{64}$'}
  changed_file:
    type: object
    additionalProperties: false
    required: [path, previous_path, status, mode, blob_sha]
    properties:
      path: {type: string, minLength: 1}
      previous_path: {type: [string, 'null']}
      status: {enum: [added, modified, removed, renamed, copied, changed]}
      mode: {type: [string, 'null'], pattern: '^(100644|100755|120000|160000|040000)$'}
      blob_sha: {oneOf: [{$ref: '#/$defs/sha40'}, {type: 'null'}]}
  finding:
    type: object
    additionalProperties: false
    required: [id, severity, summary]
    properties:
      id: {type: string, minLength: 1}
      severity: {enum: [P0, P1, P2, P3]}
      file: {type: [string, 'null']}
      line: {type: [integer, 'null'], minimum: 1}
      summary: {type: string, minLength: 1}
      resolved: {type: boolean}
properties:
  schema: {const: c2pro-review-receipt-v1}
  schema_version: {const: 1}
  receipt_id: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
  work_id: {type: string, pattern: '^C2PRO-DEV-[0-9]{2}$'}
  risk_class: {enum: [trivial, normal, material, architecture, security, high_blast_radius]}
  subject:
    type: object
    additionalProperties: false
    required: [repository_id, repository, pr_number, head_sha, base_sha, merge_base_sha, diff_digest, changed_files]
    properties:
      repository_id: {type: integer, minimum: 1}
      repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
      pr_number: {type: integer, minimum: 1}
      head_sha: {$ref: '#/$defs/sha40'}
      base_sha: {$ref: '#/$defs/sha40'}
      merge_base_sha: {$ref: '#/$defs/sha40'}
      diff_digest: {$ref: '#/$defs/digest'}
      changed_files: {type: array, minItems: 1, items: {$ref: '#/$defs/changed_file'}}
  review:
    type: object
    additionalProperties: false
    required: [role, worker_id, implementation_worker_id, evidence_tier, identity]
    properties:
      role: {enum: [principal, challenger, orchestrator_synthesis]}
      worker_id: {type: string, pattern: '^[a-z0-9_]+$'}
      implementation_worker_id: {type: string, pattern: '^[a-z0-9_]+$'}
      evidence_tier: {enum: [T1, T2, T3]}
      identity:
        type: object
        additionalProperties: false
        properties:
          github_app_id: {type: integer, minimum: 1}
          github_user_id: {type: integer, minimum: 1}
          review_id: {type: integer, minimum: 1}
          workflow_path: {type: string}
          workflow_commit_sha: {$ref: '#/$defs/sha40'}
          run_id: {type: integer, minimum: 1}
          run_attempt: {type: integer, minimum: 1}
      provider_execution:
        type: object
        additionalProperties: false
        required: [provider, model, request_ids, response_digest, prompt_template_sha256, inputs_digest, untrusted_text_wrapped]
        properties:
          provider: {type: string, minLength: 1}
          model: {type: string, minLength: 1}
          request_ids: {type: array, minItems: 1, items: {type: string, minLength: 1}}
          response_digest: {$ref: '#/$defs/digest'}
          prompt_template_sha256: {$ref: '#/$defs/hex64'}
          inputs_digest: {$ref: '#/$defs/digest'}
          untrusted_text_wrapped: {type: boolean}
  result:
    type: object
    additionalProperties: false
    required: [verdict, findings, tests_observed, architecture_drift, security_concern, scope_deviation, recommended_action]
    properties:
      verdict: {enum: [PASS, PASS_WITH_FINDINGS, BLOCK]}
      findings: {type: array, items: {$ref: '#/$defs/finding'}}
      tests_observed:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, check_run_id, conclusion]
          properties:
            name: {type: string, minLength: 1}
            check_run_id: {type: integer, minimum: 1}
            conclusion: {type: string}
      architecture_drift: {type: boolean}
      security_concern: {type: boolean}
      scope_deviation: {type: boolean}
      recommended_action: {enum: [approve, remediate, escalate]}
      synthesis_of: {type: array, items: {type: string}, uniqueItems: true}
  issued_at: {type: string, format: date-time}
