coverage:
  status:
    project:
      default:
        # CI-confirmed combined backend coverage is 72% (33,945 statements).
        # Keep a two-point buffer while ratcheting toward the 80% aspiration.
        target: 70%
        threshold: 0.5%
    patch:
      default:
        # New and changed lines are held to the long-term 80% standard now.
        target: 80%
        threshold: 0%
  range: 45..100

comment:
  layout: "reach,diff,flags,tree"
  require_changes: false
