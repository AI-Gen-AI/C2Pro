coverage:
  status:
    project:
      default:
        # Current Codecov backend baseline is 48.67%; CI also enforces 48%.
        # Aspirational target: raise this ratchet toward 70%, then 80%.
        target: 48%
        threshold: 0.5%
    patch:
      default:
        # New and changed lines are held to the long-term 80% standard now.
        target: 80%
        threshold: 0%
  range: 45..100

comment:
  layout: "reach,diff,flags,tree"
  require_changes: false
