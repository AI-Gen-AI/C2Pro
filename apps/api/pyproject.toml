[project]
name = "c2pro-api"
version = "0.1.0"
description = "C2Pro Backend API - Contract Intelligence Platform"
requires-python = ">=3.11"
authors = [
    {name = "C2Pro Team", email = "dev@c2pro.app"}
]
dependencies = [
    "langsmith>=0.7.31",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "B904",   # raise without from (sometimes intentional)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # pytest fixtures are often injected for setup/side effects
    "ARG002",  # protocol/mock implementations intentionally keep interface args
    "ARG005",  # lambda mocks intentionally mirror callback signatures
    "B017",    # legacy tests intentionally assert broad exception contracts
    "E402",    # tests sometimes set env/sys.path before imports
    "F403",    # verification compatibility re-export tests
    "F811",    # legacy domain placeholder test doubles
    "SIM117",  # nested mock contexts are clearer in legacy tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "supabase.*",
    "pymupdf.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".pytest_cache_local"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--basetemp=.pytest-tmp-local",
    "--import-mode=importlib",
]
pythonpath = [".", "src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "flow: E2E workflow tests",
    "ai: AI-related tests (may use API)",
    "auth: Authentication and authorization tests",
    "slow: Slow tests",
    "performance: Performance tests",
    "security: Security tests (critical)",
    "critical: P0 critical tests",
    "contract: Contract tests (API/frontend alignment)",
    "red_phase: RED phase TDD tests",
    "green_phase: GREEN phase TDD tests",
    "alembic_schema: use the Alembic-migrated schema instead of drop_all/create_all bootstrap",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",  # Ignora warnings de recursos no cerrados en tests
    "ignore:Importing 'parser\\.split_arg_string' is deprecated.*:DeprecationWarning",
    "ignore:'BaseCommand' is deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "src/core/ai/ab_experiment.py",
    "src/core/ai/analytics_router.py",
    "src/core/ai/analytics_service.py",
    "src/core/ai/anonymizer.py",
    "src/core/ai/anthropic_wrapper.py",
    "src/core/ai/cost_controller.py",
    "src/core/ai/example_*.py",
    "src/core/ai/fallback_client.py",
    "src/core/ai/langsmith_hub.py",
    "src/core/ai/llm_timeout_handler.py",
    "src/core/ai/prompt_registry.py",
    "src/core/ai/prompts/*",
    "src/core/ai/sync_prompts.py",
    "src/core/ai/test_*.py",
    "src/core/ai/token_counter.py",
    "src/core/ai/validators/*",
]

[tool.coverage.report]
# Per-suite coverage is not a project baseline. CI merges unit, core, coherence,
# and modules reports before enforcing the 48% ratchet. Aspirational target: 70%,
# then 80% once test investment raises the merged baseline.
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
