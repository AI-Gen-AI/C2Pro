# Qualitative Rules for Coherence Engine (CE-24)
# These rules use LLM for evaluation instead of deterministic code.
# The detection_logic field contains natural language instructions for the LLM.
# Prompts are authored in English (LLM native language) per the project principle.

# ===========================================
# SCOPE RULES
# ===========================================

- id: R-SCOPE-CLARITY-01
  name: "Scope Clarity Check"
  description: "The scope of work must be clearly defined without ambiguous terms"
  evaluator_type: llm
  category: scope
  severity: high
  detection_logic: |
    FIRST determine whether this clause is of type SCOPE and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that the scope of work does NOT contain:

    1. VAGUE TERMS such as:
       - "as necessary"
       - "where applicable"
       - "reasonable" / "reasonably"
       - "appropriate" / "appropriately"
       - "timely" / "in a timely manner"
       - "sufficient" / "sufficiently"
       - "adequate" / "adequately"
       - "approximately"

    2. OPEN-ENDED PHRASES such as:
       - "and other related work"
       - "including but not limited to"
       - "among others"
       - "and the like"
       - "etc."

    3. UNDEFINED REFERENCES such as:
       - "according to the project's needs"
       - "to the client's satisfaction"
       - "in accordance with applicable standards" (without specifying which)
       - "in line with good practices" (without defining them)

    4. UNSPECIFIED QUANTITIES:
       - "sufficient quantity"
       - "as needed"
       - "as required"

    If ANY of these elements is found, the rule is VIOLATED.

    Severity depends on:
    - critical: If it affects the contract's main scope
    - high: If it affects important deliverables
    - medium: If it affects secondary aspects
    - low: If it is in a context of acceptable flexibility
  inputs: []
  evidence_fields: ["clause.text"]

# ===========================================
# FINANCIAL RULES
# ===========================================

- id: R-PAYMENT-CLARITY-01
  name: "Payment Terms Clarity"
  description: "Payment terms must specify exact amounts, deadlines, and conditions"
  evaluator_type: llm
  category: financial
  severity: high
  detection_logic: |
    FIRST determine whether this clause is of type BUDGET and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that the payment terms CLEARLY specify:

    1. AMOUNTS:
       - Exact values in figures (not words only)
       - Or specific percentages (30%, 50%, etc.)
       - Currency clearly indicated (USD, MXN, EUR)

    2. DEADLINES:
       - Specific calendar days (15 days, 30 days)
       - Do NOT use "timely", "reasonable", "as soon as possible"
       - Clearly defined start date for the deadline

    3. CONDITIONS:
       - What must be met in order to invoice (deliverable, milestone, approval)
       - Required documentation (invoice, report, certificate)
       - Approval process if applicable

    4. PAYMENT METHOD:
       - Specified method (wire transfer, check, etc.)
       - Bank details or a reference to where to find them

    If any of these elements is MISSING or vague terms are used, the rule is VIOLATED.
  inputs: []
  evidence_fields: ["clause.text"]

# ===========================================
# LEGAL RULES
# ===========================================

- id: R-RESPONSIBILITY-01
  name: "Responsibility Assignment"
  description: "Responsibilities must be clearly assigned to a specific party"
  evaluator_type: llm
  category: legal
  severity: medium
  detection_logic: |
    FIRST determine whether this clause is of type LEGAL and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that responsibilities:

    1. ARE ASSIGNED TO A SPECIFIC PARTY:
       - "The Contractor shall..."
       - "The Client shall provide..."
       - Do NOT use "the parties" for specific obligations
       - Do NOT use passive voice without a subject ("shall be performed", "shall be delivered")

    2. HAVE CLEAR ACTION VERBS:
       - "shall", "will perform", "will provide", "will deliver"
       - Do NOT use "may", "might", "should" for obligations

    3. DO NOT CONTAIN AMBIGUOUS SHARED RESPONSIBILITIES:
       - "both parties shall collaborate" without specifying how
       - "jointly" without defined roles

    4. SPECIFY THE SCOPE OF THE RESPONSIBILITY:
       - What is included and what is not
       - Clear limits

    NON-VIOLATION GUARD:
    - If a named party appears (for example, Contractor, Client, Owner,
      Engineer, Buyer, Seller, Supplier) together with a mandatory verb
      ("shall", "will be responsible", "will guarantee", "will provide",
      "will deliver", "must", "is responsible"), it is NOT a violation even
      if the scope is broad or the clause references other clauses or contracts.
    - Standard cross-default clauses, performance-guarantee clauses
      ("shall give satisfactory performance"), and risk/cost-allocation clauses
      are NOT violations in themselves.
    - Broad scope or cross-references, on their own, are at most
      "low" severity — NEVER "high".

    Only if NO specific party is identifiable as responsible, the rule is VIOLATED.
  inputs: []
  evidence_fields: ["clause.text"]

- id: R-TERMINATION-01
  name: "Termination Conditions"
  description: "Termination conditions must be specific and balanced"
  evaluator_type: llm
  category: legal
  severity: high
  detection_logic: |
    FIRST determine whether this clause is of type LEGAL and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that the termination conditions:

    1. SPECIFY CLEAR GROUNDS:
       - NOT only "for breach" without defining what constitutes a breach
       - List specific grounds (non-payment, delay > X days, etc.)
       - Distinguish between termination for cause and without cause

    2. INCLUDE A NOTICE PERIOD:
       - Specific number of days in advance (30 days, 60 days)
       - Do NOT use "with reasonable notice"
       - Notice format (written, certified, etc.)

    3. DESCRIBE CONSEQUENCES:
       - What happens to work in progress
       - How pending payments are settled
       - Return of materials/information

    4. BE BALANCED:
       - Both parties must be able to terminate under similar conditions
       - Do NOT allow termination by only one party without just cause

    5. INCLUDE A PROCEDURE:
       - Steps to follow to terminate
       - Cure period for remediable breaches

    If the conditions are VAGUE, UNBALANCED, or INCOMPLETE,
    the rule is VIOLATED.
  inputs: []
  evidence_fields: ["clause.text"]

# ===========================================
# QUALITY RULES
# ===========================================

- id: R-QUALITY-STANDARDS-01
  name: "Quality Standards Definition"
  description: "Quality standards must be referenced specifically"
  evaluator_type: llm
  category: quality
  severity: medium
  detection_logic: |
    FIRST determine whether this clause is of type QUALITY and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that the quality standards:

    1. REFERENCE SPECIFIC STANDARDS:
       - ISO with full number (ISO 9001:2015, ISO 14001)
       - ASTM with designation (ASTM A36, ASTM D6400)
       - NOM/NMX with number (NOM-001-SEDE-2012)
       - Other applicable standards with a full reference

    2. DO NOT USE ONLY GENERIC REFERENCES:
       - "good industry practices" without specifying which
       - "international standards" without naming them
       - "applicable standards" without listing them
       - "acceptable quality" without criteria

    3. INCLUDE ACCEPTANCE CRITERIA:
       - Numerical tolerances where applicable
       - Measurable parameters
       - Verification method

    4. SPECIFY INSPECTION PROCEDURES:
       - Who inspects
       - Inspection frequency
       - Required documentation

    If the standards are VAGUE or NOT specifically REFERENCED,
    the rule is VIOLATED.
  inputs: []
  evidence_fields: ["clause.text"]

# ===========================================
# TECHNICAL RULES
# ===========================================

- id: R-TECHNICAL-SPEC-CLARITY-01
  name: "Technical Specification Clarity"
  description: "Technical specifications must identify standards, materials, and verifiable criteria"
  evaluator_type: llm
  category: technical
  severity: high
  detection_logic: |
    FIRST determine whether this clause is of type TECHNICAL and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that the technical specifications:

    1. IDENTIFY CONCRETE MATERIALS OR SYSTEMS:
       - Applicable type, grade, model, or technical family
       - Do NOT use only "suitable material" or "appropriate equipment"

    2. REFERENCE STANDARDS OR TECHNICAL DOCUMENTS:
       - ISO, EN, ASTM, UNE, DIN, or another applicable standard
       - Drawings, datasheets, or technical reports with an identifiable code

    3. INCLUDE VERIFICATION CRITERIA:
       - Test, inspection, certificate, or measurable tolerance
       - Party responsible for technical acceptance

    If the specification is generic or does not allow verifying compliance,
    the rule is VIOLATED.
  inputs: []
  evidence_fields: ["clause.text"]

# ===========================================
# SCHEDULE RULES
# ===========================================

- id: R-SCHEDULE-CLARITY-01
  name: "Schedule Terms Clarity"
  description: "Deadlines and schedules must be clearly defined"
  evaluator_type: llm
  category: schedule
  severity: high
  detection_logic: |
    FIRST determine whether this clause is of type TIME and contains a substantive, evaluable obligation/content.
    If it is a HEADING, TITLE, table row, budget line item, appendix list, or does NOT impose an obligation relevant to this category → respond with rule_violated=false and impact 0.
    ONLY if it is applicable, evaluate the rule.

    Verify that the schedule terms:

    1. SPECIFY CONCRETE DATES OR DURATIONS:
       - Specific dates (January 15, 2026)
       - Or durations in calendar days/weeks/months
       - Do NOT use "as soon as possible", "at the earliest", "in a timely manner"

    2. CLEARLY DEFINE MILESTONES:
       - Milestone name
       - Completion criterion
       - Date or deadline

    3. ESTABLISH A STARTING POINT:
       - When the deadline starts counting
       - Clear triggering event (signature, advance payment, notification)

    4. INDICATE CONSEQUENCES OF DELAY:
       - Penalties if applicable (specific amount)
       - Procedure for extensions
       - Force majeure grounds

    5. HANDLE DEPENDENCIES:
       - If one deadline depends on another, specify the relationship
       - Responsibility for delays caused by the other party

    If the deadlines are AMBIGUOUS or INCOMPLETE, the rule is VIOLATED.
  inputs: []
  evidence_fields: ["clause.text"]
