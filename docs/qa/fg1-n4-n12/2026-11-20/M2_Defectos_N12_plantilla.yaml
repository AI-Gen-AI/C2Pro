  copy_only: true
  original_claim_sha256: REPLACE
  modified_claim_sha256: REPLACE
  single_delta_description: DESCRIBE_ONE_CHANGE_WITHOUT_PASTING_RESTRICTED_TEXT
  target_kind: risk
  materiality: critical|high|other
  clean_control_id: CONTROL-001
  n12_input_scope: full_attested|focal_partial|unavailable
  expected_action: detect_with_cited_explanation
  expected_issue_type: omission|contradiction
  result: NOT_RUN
  n12_raw_output_hash: null
  n12_product_status: null
  detected: null
  false_positive: null
  abstained: null
  abstention_cause_code: null
  source_support_confirmed_by: INDEPENDENT_ADJUDICATOR
  evidence_ref: ''
  review_notes: ''
negative_control_template:
  control_id: CONTROL-001
  family: OMISSION
  source_set_id: REPLACE
  unmodified_n4_item_id: REPLACE
  expected_n12_behavior: no_unsupported_defect_claim
  outcome: NOT_RUN
metric_definitions:
  sensitivity: true_seeded_defects_correctly_detected / evaluable_seeded_defects
  fpr_clean_controls: unsupported_defect_accusations / assessed_clean_controls
  abstention_rate: abstentions / seeded_trials
  caused_abstention_rate: abstentions_with_supported_cause / all_abstentions
  interval: Wilson_two_sided_95_percent
notes:
- Variants are recipes, not 60 verified real-contract defects. Never instantiate when source does not support mutation.
- For v1 N4 only risk-bearing variants are scorable as CURRENT_N4; other kinds are FUTURE_TYPED_FACT_SCOPE.
- A justified abstention is a safe outcome but not a detected defect; it precludes unrestricted N12 PASS in critical
  stratum.
- Do not use real providers, contracts, or private excerpts under M2 design authority.
