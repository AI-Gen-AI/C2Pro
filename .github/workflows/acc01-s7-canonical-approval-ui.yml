name: ACC-01 S7 — Technical source and explicit approval UI

on:
  pull_request:
    branches:
      - feat/acc01-s7-canonical-technical-wbs-20261029
      - integration/acc01-e2e-20261025
    paths:
      - "apps/web/types/document.ts"
      - "apps/web/hooks/useProjectDocuments.ts"
      - "apps/web/components/features/wbs/TechnicalWBSReviewPanel.tsx"
      - "apps/web/components/features/wbs/TechnicalWBSReviewPanel.test.tsx"
      - "apps/web/components/features/wbs/CanonicalTechnicalWBSApprovalPanel.tsx"
      - "apps/web/components/features/wbs/CanonicalTechnicalWBSApprovalPanel.test.tsx"
      - ".github/workflows/acc01-s7-canonical-approval-ui.yml"

permissions:
  contents: read

jobs:
  s7-canonical-approval-ui:
    name: "S7 explicit approval — TypeScript, lint, focused tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsubW9jay5sb2NhbCQ
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup frontend toolchain (frozen lockfile)
        uses: ./.github/actions/setup-node-web
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: S7 exact typed source and independent canonical approval UX tests
        working-directory: apps/web
        run: |
          node ./scripts/vitest-no-warn.mjs run --config vitest.config.mts \
            hooks/useProjectDocuments.test.ts \
            components/features/wbs/TechnicalWBSReviewPanel.test.tsx \
            components/features/wbs/CanonicalTechnicalWBSApprovalPanel.test.tsx
