name: Golden Corpus Evaluations

on:
  push:
    branches: [main, develop]
    paths:
      - "evals/**"
      - ".github/workflows/golden-corpus-evals.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "evals/**"
      - ".github/workflows/golden-corpus-evals.yml"
  workflow_dispatch:

concurrency:
  group: golden-corpus-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  run-corpus:
    name: Run 15-bundle Golden Corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install corpus dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml "pydantic>=2.0" pytest

      - name: Run golden corpus
        run: python evals/run_evals.py --corpus --ci --output evals/results

      - name: Run corpus regression tests
        run: pytest tests/evals/test_golden_corpus.py -v --rootdir=tests/evals

      - name: Upload corpus JSON results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-corpus-results-json
          path: evals/results/corpus_results.json

      - name: Upload corpus JUnit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-corpus-results-xml
          path: evals/results/corpus_results.xml

      - name: Summarise corpus run
        if: always()
        run: |
          if [ -f evals/results/corpus_results.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          data = json.loads(pathlib.Path("evals/results/corpus_results.json").read_text())
          print("## Golden Corpus")
          print("")
          print(f"- **Total bundles:** {data['total_bundles']}")
          print(f"- **Passed:** {data['passed_bundles']}")
          print(f"- **Failed:** {data['failed_bundles']}")
          print(f"- **Dimensions covered:** {', '.join(data['dimensions_covered'])}")
          print(f"- **Expected issues total:** {data['total_expected_issues']}")
          print(f"- **Expected alerts total:** {data['total_expected_alerts']}")
          print(f"- **Alert recall:** {data['aggregate_recall_pct']}%")
          PY
          fi
