name: TEMP ACC-01 S7 PostgreSQL exact traceback
on:
  push:
    branches: [feat/acc01-s7-structured-links-20261029]
    paths: [.github/workflows/acc01-s7-pg-diagnostic-temp.yml]
jobs:
  isolated-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-backend
      - run: C2PRO_REDIS_TEST_PORT=6379 python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --recreate-db
      - name: Focused exact-HEAD S7 three-source PostgreSQL traceback
        working-directory: apps/api
        run: python -m pytest tests/integration/analysis/test_s7_structured_wbs_three_source_pg.py -vv --tb=short --show-capture=no -x
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
