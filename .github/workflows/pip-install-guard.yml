name: Pip Install Guard
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/workflows/**.yaml'
      - '.github/actions/**'
      - '.github/actions/**.yaml'
      - '.github/scripts/pip_install_guard.py'
      - '.github/scripts/test_pip_install_guard.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/workflows/**.yaml'
      - '.github/actions/**'
      - '.github/actions/**.yaml'
      - '.github/scripts/pip_install_guard.py'
      - '.github/scripts/test_pip_install_guard.py'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run guard unit tests
        run: |
          python3 .github/scripts/test_pip_install_guard.py
      - name: Run pip install guard
        run: |
          python3 .github/scripts/pip_install_guard.py
