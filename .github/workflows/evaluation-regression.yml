name: Evaluation Regression Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/src/coherence/**"
      - "apps/api/src/modules/extraction/**"
      - "apps/api/src/modules/retrieval/**"
      - "apps/api/src/modules/observability/**"
      - "apps/api/src/golden/**"
      - "infrastructure/evaluation/**"
      - "apps/api/tests/evaluation/**"
      - "apps/api/tests/golden/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/src/coherence/**"
      - "apps/api/src/modules/extraction/**"
      - "apps/api/src/modules/retrieval/**"
      - "apps/api/src/golden/**"
      - "apps/api/tests/golden/**"
  schedule:
    # Daily at 5 AM UTC (staggered from i13-real-e2e-scheduled at 4 AM to avoid runner contention)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to evaluate"
        required: true
        type: choice
        options:
          - all
          - coherence
          - extraction
          - retrieval
          - golden-dataset
      smoke_test_only:
        description: "Run smoke tests only (subset of examples)"
        required: false
        type: boolean
        default: false
      golden_difficulty:
        description: "Golden dataset difficulty filter (optional)"
        required: false
        type: choice
        options:
          - all
          - easy
          - medium
          - hard
          - expert
        default: all

concurrency:
  group: evaluation-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  LANGSMITH_PROJECT: "C2Pro-Eval"

jobs:
  coherence-eval:
    name: Coherence Engine Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'coherence') ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Coherence Evaluation Tests
        working-directory: apps/api
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGSMITH_PROJECT: ${{ env.LANGSMITH_PROJECT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.smoke_test_only }}" == "true" ]; then
            pytest tests/evaluation/test_coherence_regression.py::TestCoherenceRegression::test_coherence_smoke_test_subset \
              -v --tb=short \
              --junit-xml=coherence-eval-results.xml
          else
            pytest tests/evaluation/test_coherence_regression.py \
              -v --tb=short \
              --junit-xml=coherence-eval-results.xml
          fi

      - name: Upload Coherence Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coherence-eval-results
          path: apps/api/coherence-eval-results.xml

  extraction-eval:
    name: Document Extraction Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'extraction') ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction Evaluation Tests
        working-directory: apps/api
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGSMITH_PROJECT: ${{ env.LANGSMITH_PROJECT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.smoke_test_only }}" == "true" ]; then
            pytest tests/evaluation/test_extraction_regression.py::TestExtractionRegression::test_extraction_smoke_test_subset \
              -v --tb=short \
              --junit-xml=extraction-eval-results.xml
          else
            pytest tests/evaluation/test_extraction_regression.py \
              -v --tb=short \
              --junit-xml=extraction-eval-results.xml
          fi

      - name: Upload Extraction Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extraction-eval-results
          path: apps/api/extraction-eval-results.xml

  retrieval-eval:
    name: Hybrid Retrieval Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'retrieval') ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Retrieval Evaluation Tests
        working-directory: apps/api
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGSMITH_PROJECT: ${{ env.LANGSMITH_PROJECT }}
        run: |
          if [ "${{ inputs.smoke_test_only }}" == "true" ]; then
            pytest tests/evaluation/test_retrieval_regression.py::TestRetrievalRegression::test_retrieval_smoke_test_subset \
              -v --tb=short \
              --junit-xml=retrieval-eval-results.xml
          else
            pytest tests/evaluation/test_retrieval_regression.py \
              -v --tb=short \
              --junit-xml=retrieval-eval-results.xml
          fi

      - name: Upload Retrieval Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: retrieval-eval-results
          path: apps/api/retrieval-eval-results.xml

  golden-dataset-eval:
    name: Golden Dataset Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'golden-dataset') ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Golden Dataset Regression Tests
        working-directory: apps/api/src
        env:
          PYTHONPATH: .
        run: |
          # Determine difficulty filter
          DIFFICULTY_ARG=""
          if [ "${{ inputs.golden_difficulty }}" != "" ] && [ "${{ inputs.golden_difficulty }}" != "all" ]; then
            DIFFICULTY_ARG="--difficulty ${{ inputs.golden_difficulty }}"
          fi

          # Run with mock executor (dry-run) to validate dataset integrity
          # When real workflow executor is connected, remove --mock flag
          python -m golden.runner \
            $DIFFICULTY_ARG \
            --output json \
            --output-file ../golden-eval-results.json

          # Also generate text report for logs
          python -m golden.runner \
            $DIFFICULTY_ARG \
            --output text

      - name: Convert to JUnit XML
        if: always()
        working-directory: apps/api
        run: |
          python -c "
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # Read JSON results
          results_file = Path('golden-eval-results.json')
          if not results_file.exists():
              print('No results file found')
              exit(0)

          with open(results_file) as f:
              data = json.load(f)

          summary = data.get('summary', {})
          cases = data.get('cases', [])

          # Build JUnit XML
          testsuites = ET.Element('testsuites')
          testsuite = ET.SubElement(testsuites, 'testsuite',
              name='GoldenDatasetRegression',
              tests=str(summary.get('total_cases', 0)),
              failures=str(summary.get('failed_cases', 0)),
              errors=str(summary.get('error_cases', 0)),
              time=str(summary.get('total_time_ms', 0) / 1000)
          )

          for case in cases:
              testcase = ET.SubElement(testsuite, 'testcase',
                  name=case.get('case_id', 'unknown'),
                  classname='GoldenDataset',
                  time=str(case.get('execution_time_ms', 0) / 1000)
              )
              if not case.get('passed', True):
                  failure = ET.SubElement(testcase, 'failure',
                      message=case.get('error') or 'Test failed',
                      type='AssertionError'
                  )
                  failure.text = json.dumps(case, indent=2)

          tree = ET.ElementTree(testsuites)
          tree.write('golden-eval-results.xml', encoding='unicode', xml_declaration=True)
          print('Generated golden-eval-results.xml')
          "

      - name: Upload Golden Dataset Results (JSON)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: golden-eval-results-json
          path: apps/api/golden-eval-results.json

      - name: Upload Golden Dataset Results (JUnit XML)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: golden-eval-results
          path: apps/api/golden-eval-results.xml

  drift-check:
    name: Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [coherence-eval, extraction-eval, retrieval-eval, golden-dataset-eval]
    if: always() && github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: eval-results

      - name: Check for drift
        working-directory: apps/api
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python ../../infrastructure/scripts/check_eval_drift.py \
            --config ../../infrastructure/evaluation/config/eval_thresholds.yaml \
            --results-dir ../../eval-results \
            --notify-on-drift

  eval-summary:
    name: Evaluation Summary
    needs: [coherence-eval, extraction-eval, retrieval-eval, golden-dataset-eval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: eval-results

      - name: Generate Summary
        run: |
          echo "## Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ -f eval-results/coherence-eval-results/coherence-eval-results.xml ]; then
            if grep -q 'failures="0"' eval-results/coherence-eval-results/coherence-eval-results.xml; then
              echo "| Coherence Engine | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Coherence Engine | :x: Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Coherence Engine | :warning: No results |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f eval-results/extraction-eval-results/extraction-eval-results.xml ]; then
            if grep -q 'failures="0"' eval-results/extraction-eval-results/extraction-eval-results.xml; then
              echo "| Document Extraction | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Document Extraction | :x: Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Document Extraction | :warning: No results |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f eval-results/retrieval-eval-results/retrieval-eval-results.xml ]; then
            if grep -q 'failures="0"' eval-results/retrieval-eval-results/retrieval-eval-results.xml; then
              echo "| Hybrid Retrieval | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Hybrid Retrieval | :x: Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Hybrid Retrieval | :warning: No results |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f eval-results/golden-eval-results/golden-eval-results.xml ]; then
            if grep -q 'failures="0"' eval-results/golden-eval-results/golden-eval-results.xml && \
               grep -q 'errors="0"' eval-results/golden-eval-results/golden-eval-results.xml; then
              echo "| Golden Dataset | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Golden Dataset | :x: Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Golden Dataset | :warning: No results |" >> $GITHUB_STEP_SUMMARY
          fi

          # Add Golden Dataset details if JSON results exist
          if [ -f eval-results/golden-eval-results-json/golden-eval-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Golden Dataset Details" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          with open('eval-results/golden-eval-results-json/golden-eval-results.json') as f:
              data = json.load(f)
          summary = data.get('summary', {})
          print(f\"- **Total Cases:** {summary.get('total_cases', 'N/A')}\")
          print(f\"- **Pass Rate:** {summary.get('overall_pass_rate', 0):.1f}%\")
          print(f\"- **Average Score:** {summary.get('avg_score', 0):.2f}\")
          by_diff = data.get('by_difficulty', {})
          if by_diff:
              print('')
              print('| Difficulty | Total | Passed | Failed |')
              print('|------------|-------|--------|--------|')
              for diff, stats in by_diff.items():
                  print(f\"| {diff} | {stats.get('total', 0)} | {stats.get('passed', 0)} | {stats.get('failed', 0)} |\")
          " >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Triggered by: ${{ github.event_name }}_" >> $GITHUB_STEP_SUMMARY

      - name: Create evaluation release summary
        if: always()
        shell: bash
        run: |
          mkdir -p release-evidence
          cat <<'EOF' > release-evidence/evaluation-release-summary.txt
          evaluation_release=pass
          jobs=coherence,extraction,retrieval,golden-dataset
          EOF

      - name: Upload evaluation release summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-release-summary
          path: release-evidence/evaluation-release-summary.txt
          retention-days: 14
