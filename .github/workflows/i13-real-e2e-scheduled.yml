name: Scheduled I13 Real E2E Reliability

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      release_commit_sha:
        description: "Release candidate SHA for Gate 7 reliability evidence"
        required: false
        type: string

permissions:
  contents: read

jobs:
  i13-real-e2e-reliability:
    name: I13 Real E2E Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}      
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      AUTH_BOOTSTRAP_ALLOW_FALLBACK_EMERGENCY: "true"
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "100"
      CLERK_FRONTEND_API_URL: https://clerk.c2pro.io
      CLERK_BACKEND_API_URL: https://api.clerk.com
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      BCRYPT_ROUNDS: 12


    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout release candidate code
        if: github.event_name == 'workflow_dispatch' && inputs.release_commit_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit_sha }}

      - name: Checkout code
        if: github.event_name != 'workflow_dispatch' || inputs.release_commit_sha == ''
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-magic

      - name: Infra preflight
        run: |
          mkdir -p apps/api/ci-artifacts
          python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis | tee apps/api/ci-artifacts/i13-scheduled-preflight.log

      - name: Run I13 real E2E reliability suite
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/e2e/flows/test_i13_decision_intelligence_route_contract.py \
            tests/e2e/flows/test_i13_decision_intelligence_real_e2e.py \
            -v \
            --tb=short \
            --junit-xml=i13-scheduled-real-e2e-results.xml

      - name: Collect infra diagnostics on failure
        if: failure()
        run: |
          mkdir -p apps/api/ci-artifacts
          echo "=== Docker Compose Services ===" > apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log
          docker compose -f docker-compose.test.yml ps >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log || true
          echo "=== All Containers ===" >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log
          docker ps -a >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log || true
          echo "=== PostgreSQL Logs ===" >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log
          docker compose -f docker-compose.test.yml logs postgres-test >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log || true
          echo "=== Redis Logs ===" >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log
          docker compose -f docker-compose.test.yml logs redis-test >> apps/api/ci-artifacts/i13-scheduled-infra-diagnostics.log || true

      - name: Upload scheduled I13 junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i13-scheduled-real-e2e-junit
          path: apps/api/i13-scheduled-real-e2e-results.xml
          retention-days: 14

      - name: Upload scheduled I13 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i13-scheduled-real-e2e-diagnostics
          path: apps/api/ci-artifacts/
          retention-days: 7

      - name: Create I13 release summary
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p apps/api/release-evidence
          cat <<EOF > apps/api/release-evidence/i13-release-summary.txt
          reliability_release=pass
          release_commit_sha=${{ inputs.release_commit_sha }}
          executed_commit_sha=$(git rev-parse HEAD)
          artifact=i13-scheduled-real-e2e-results.xml
          EOF

      - name: Upload I13 release summary
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: i13-release-summary
          path: apps/api/release-evidence/i13-release-summary.txt
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
