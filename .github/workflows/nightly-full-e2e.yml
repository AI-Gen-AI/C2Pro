name: Nightly Full E2E

on:
  schedule:
    # Run before the 04:00 I13 and 05:00 evaluation lanes.
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-full-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-playwright-suite:
    # Scheduled, so it never blocks a PR. The run's status must be the suite's
    # real result: continue-on-error made a failing suite report success.
    # No API backend is started here (NEXT_PUBLIC_API_URL points at an unused
    # port), so backend-dependent specs fail; it is not acceptance evidence.
    name: Full Playwright suite (frontend + Clerk, no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup web environment
        uses: ./.github/actions/setup-node-web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run full Playwright suite
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') }}
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/nightly-results.json
        run: ./node_modules/.bin/playwright test --project=chromium --reporter=list,json

      # A suite that never ran is not a pass.
      - name: Fail when Clerk credentials are unavailable
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' || (env.CLERK_SECRET_KEY == '' && env.CLERK_TESTING_TOKEN == '') }}
        run: |
          echo "::error::Full E2E NOT EXECUTED: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY or CLERK_TESTING_TOKEN are required."
          exit 1

      - name: Summarize suite result
        if: always()
        working-directory: apps/web
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const file = "playwright-report/nightly-results.json";
          console.log("## Nightly Full E2E (frontend + Clerk, no backend)\n");
          if (!fs.existsSync(file)) {
            console.log("**NOT EXECUTED**: no Playwright results were produced.");
            process.exit(0);
          }
          const { stats, suites = [] } = JSON.parse(fs.readFileSync(file, "utf8"));
          console.log("| passed | failed | flaky | skipped |\n|---:|---:|---:|---:|");
          console.log(`| ${stats.expected} | ${stats.unexpected} | ${stats.flaky} | ${stats.skipped} |\n`);
          const failed = [];
          const walk = (suite, path) => {
            for (const spec of suite.specs || []) {
              if (spec.tests.some((t) => t.status === "unexpected")) {
                failed.push(`${spec.file}: ${[...path, spec.title].join(" › ")}`);
              }
            }
            for (const child of suite.suites || []) walk(child, [...path, child.title]);
          };
          suites.forEach((s) => walk(s, []));
          if (failed.length) {
            console.log(`<details><summary>${failed.length} failing specs</summary>\n`);
            failed.forEach((f) => console.log(`- ${f}`));
            console.log("\n</details>");
          }
          EOF

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-full-e2e-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 3
