# Full-dependency vulnerability audit (existing deps, not just PR-introduced
# ones — that is dependency-review.yml's job).
#
#   * pip-audit: advisory — reports to the job summary, never blocks.
#   * osv-scan: scans the JS dependency tree (pnpm-lock.yaml) against the OSV
#     database and blocks on Critical advisories (CVSS >= 9.0). Replaces the
#     former `pnpm audit`, which stopped working when the npm legacy audit
#     endpoint was retired (HTTP 410 — ERR_PNPM_AUDIT_BAD_RESPONSE). The old job
#     gated on `--audit-level critical`; the severity gate here preserves that
#     threshold behavior (Medium/Low are reported but non-blocking). See
#     TASK-DEV-024.

name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - "apps/api/requirements*.txt"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend requirements
        run: |
          set -o pipefail
          pip-audit -r apps/api/requirements.txt 2>&1 | tee pip-audit.log || AUDIT_FAILED=1
          {
            echo "## pip-audit (advisory)"
            echo ""
            echo '```'
            tail -n 50 pip-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${AUDIT_FAILED:-0}"

  osv-scan:
    name: OSV scan (blocks on Critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # osv-scanner exits non-zero on ANY advisory regardless of severity. We let
      # it run to completion (continue-on-error) to emit JSON, then gate on
      # severity below — so only a Critical advisory blocks CI while pre-existing
      # High/Medium/Low advisories in pinned/transitive deps do not. Pinned to a
      # specific release for stable scanner behavior.
      - name: Scan dependency lockfile against the OSV database
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=pnpm-lock.yaml

      # Fails only on CVSS >= 9.0 (Critical), preserving the old
      # `pnpm audit --audit-level critical` threshold. Fail-closed if the
      # scanner produced no parseable results.
      - name: Gate on Critical severity
        run: python3 .github/scripts/osv_gate.py osv-results.json
