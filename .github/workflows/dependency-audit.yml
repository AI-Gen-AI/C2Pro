# Full-dependency vulnerability audit (existing deps, not just PR-introduced
# ones — that is dependency-review.yml's job).
#
#   * pip-audit: advisory — reports to the job summary, never blocks.
#   * osv-scan: blocks on known vulnerabilities in the JS dependency tree
#     (pnpm-lock.yaml) via Google's OSV scanner. Replaces the former `pnpm audit`,
#     which stopped working when the npm legacy audit endpoint was retired
#     (HTTP 410 — ERR_PNPM_AUDIT_BAD_RESPONSE). See TASK-DEV-024.

name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - "apps/api/requirements*.txt"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend requirements
        run: |
          set -o pipefail
          pip-audit -r apps/api/requirements.txt 2>&1 | tee pip-audit.log || AUDIT_FAILED=1
          {
            echo "## pip-audit (advisory)"
            echo ""
            echo '```'
            tail -n 50 pip-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${AUDIT_FAILED:-0}"

  osv-scan:
    name: OSV scan (blocks on vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Scans pnpm-lock.yaml against the OSV database and fails on any known
      # vulnerability in the resolved dependency tree. Pinned to a specific
      # release so scanner behavior is stable (the action's own README notes
      # behavior may change across minor patches when unpinned).
      - name: Scan dependency lockfile against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
