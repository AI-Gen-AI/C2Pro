# Full-dependency vulnerability audit (existing deps, not just PR-introduced
# ones — that is dependency-review.yml's job).
#
#   * pip-audit: advisory — reports to the job summary, never blocks.
#   * pnpm audit: blocks on CRITICAL findings in production dependencies.

name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - "apps/api/requirements*.txt"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend requirements
        run: |
          set -o pipefail
          pip-audit -r apps/api/requirements.txt 2>&1 | tee pip-audit.log || AUDIT_FAILED=1
          {
            echo "## pip-audit (advisory)"
            echo ""
            echo '```'
            tail -n 50 pip-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${AUDIT_FAILED:-0}"

  pnpm-audit:
    name: pnpm audit (blocks on critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Audit production dependencies
        run: pnpm audit --audit-level critical --prod
