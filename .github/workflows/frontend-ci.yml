name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Typecheck and lint run in parallel — they are independent static checks
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsubW9jay5sb2NhbCQ
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      # ADR-009 §18: Coherence Score™ paths must never collapse null → 0.
      # Bans `?? 0` / `|| 0` in coherence components. Weight fallbacks
      # (`weights_used[cat] ?? 0`) are allowed because they apply to
      # percentages, not score values.
      - name: Coherence score-path null-fallback guard (ADR-009 §18)
        working-directory: .
        run: |
          set -euo pipefail
          MATCHES=$(grep -rEn '\?\? *0([^.0-9]|$)|\|\| *0([^.0-9]|$)' \
            apps/web/components/coherence/ \
            apps/web/lib/api/contracts.ts \
            --include='*.tsx' --include='*.ts' \
            | grep -v 'weights_used' \
            | grep -v '\.test\.' \
            | grep -v 'test-utils' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::ADR-009 §18 violation — '?? 0' or '|| 0' detected on a Coherence Score™ path:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✓ No null→0 collapses on coherence score paths."

  tests:
    name: Tests + Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, lint]
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsubW9jay5sb2NhbCQ
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E smoke tests
        run: pnpm test:e2e -- src/tests/e2e/coherence-v1.spec.ts --project=chromium

      - name: API generation drift check
        run: pnpm generate:api:check

      - name: Create frontend release summary
        if: always()
        shell: bash
        run: |
          mkdir -p release-evidence
          cat <<'EOF' > release-evidence/frontend-release-summary.txt
          frontend_ci=pass
          includes=typecheck,lint,unit-integration,e2e,api-generation-drift
          EOF

      - name: Render quality gate report
        if: always()
        uses: ./.github/actions/quality-report
        with:
          wireframe-coverage-json: apps/web/wireframe-coverage.json
          output: quality-report.md

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-report
          path: quality-report.md
          retention-days: 90

      - name: Upload frontend release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-summary
          path: apps/web/release-evidence/frontend-release-summary.txt
          retention-days: 14
