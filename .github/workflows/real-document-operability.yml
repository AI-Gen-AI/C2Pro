# Test Suite ID: TASK-OPS-DOCFLOW-012
# Real-document operability gate for upload -> analysis -> API/UI readiness.

name: Real Document Operability

on:
  workflow_dispatch:
    inputs:
      run_real_document_flow:
        description: "Run the operator-only real document flow with real fixtures and environment."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      # ACC-01 partial S1-S2 pilot (owner-authorized, one paid extraction). Reuses this manually registered workflow so the
      # branch definition is dispatchable before any new workflow file exists on the default branch.
      run_s1_s2_real_ai_pilot:
        description: "Run ONLY the single real-AI risk extraction (no gates). Needs confirm_candidate_sha."
        required: false
        default: false
        type: boolean
      confirm_candidate_sha:
        description: "Full SHA being dispatched; prevents an accidental paid run."
        required: false
        default: ""
        type: string
      # Second functional pilot: REAL AI + browser + human review + PostgreSQL on ONE project. Its economic authorization is
      # SEPARATE from the first pilot (which was a single, already executed run): it needs the owner's explicit phrase.
      run_real_ai_hitl_vertical:
        description: "Run ONLY the real-AI browser + HITL + PostgreSQL vertical (TS-E2E-REAL-AI-HITL-001). Needs confirm_candidate_sha and owner_authorization."
        required: false
        default: false
        type: boolean
      owner_authorization:
        description: "Type exactly: OWNER-AUTHORIZED-REAL-AI-HITL-VERTICAL (the owner's express authorization of THIS run)."
        required: false
        default: ""
        type: string
      governor_max_calls:
        description: "Hard cap on provider calls across API and worker (default 12, ceiling 20)."
        required: false
        default: "12"
        type: string
      governor_max_usd:
        description: "Hard cap on provider spend in USD, worst case checked BEFORE each call (default 1.00, ceiling 2.00)."
        required: false
        default: "1.00"
        type: string

permissions:
  contents: read

env:
  C2PRO_AI_MOCK: "1"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  real-document-gate:
    name: Real Document Flow, Coverage, Golden Corpus, and Lint
    if: ${{ !inputs.run_s1_s2_real_ai_pilot && !inputs.run_real_ai_hitl_vertical }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-magic

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap backend test infrastructure
        run: C2PRO_REDIS_TEST_PORT=6379 python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --recreate-db

      - name: Record operator-only real document status
        if: github.event_name == 'workflow_dispatch' && inputs.run_real_document_flow != 'true'
        run: |
          echo "Real Document Flow | Needs real fixtures + env | No (operator)" >> "$GITHUB_STEP_SUMMARY"

      - name: Real document flow gate
        if: github.event_name == 'workflow_dispatch' && inputs.run_real_document_flow == 'true'
        working-directory: apps/api
        run: python -m pytest tests/integration/document_flow/ -q

      - name: Core AI coverage gate
        working-directory: apps/api
        run: python -m pytest tests/unit/core/ai/ --cov=src/core/ai --cov-report=term-missing --cov-fail-under=70 -q

      - name: Infrastructure coverage gate
        working-directory: apps/api
        run: python -m pytest tests/unit/core/observability tests/unit/core/resilience tests/unit/core/security --cov=src/core/observability --cov=src/core/resilience --cov=src/core/security --cov-report=term-missing --cov-fail-under=70 -q

      - name: Golden corpus eval gate
        working-directory: apps/api
        run: |
          python -m evals.run_evals
          python -m pytest tests/evals/test_golden_corpus.py -q

      - name: Full backend suite gate
        id: full-backend
        continue-on-error: true
        working-directory: apps/api
        run: python -m pytest tests/ -x -q

      - name: Root lint gate
        run: pnpm lint

      - name: Record approved blocker tracking
        if: always()
        run: |
          cat > real-document-operability-blockers.md <<'EOF'
          # Real Document Operability Blockers

          Test Suite ID: TASK-OPS-DOCFLOW-012

          ## Known Tracked Blockers

          - Real Document Flow | Needs real fixtures + env | No (operator)
          - `TASK-COH-V2-VERSIONING-006`: Canonical score-version migration must bootstrap PostgreSQL cleanly before downstream gates can run.

          ## Passing Gates Required Before This Tracking

          - Real document flow: operator dispatch only with `run_real_document_flow=true`; command `python -m pytest tests/integration/document_flow/ -q`
          - Core AI coverage: `python -m pytest tests/unit/core/ai/ --cov=src/core/ai --cov-report=term-missing --cov-fail-under=70 -q`
          - Infrastructure coverage: `python -m pytest tests/unit/core/observability tests/unit/core/resilience tests/unit/core/security --cov=src/core/observability --cov=src/core/resilience --cov=src/core/security --cov-report=term-missing --cov-fail-under=70 -q`
          - Golden corpus: `python -m evals.run_evals` and `python -m pytest tests/evals/test_golden_corpus.py -q`
          - Root lint: `pnpm lint`
          EOF
          cat real-document-operability-blockers.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload golden corpus artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 3
          name: real-document-golden-corpus
          path: |
            evals/results/corpus_results.json
            evals/results/corpus_results.xml

      - name: Upload blocker tracking
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 3
          name: real-document-operability-blockers
          path: real-document-operability-blockers.md

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  s1-s2-real-ai-pilot:
    # Manual-only, double-confirmed, one provider call. NEVER part of CI. Proves the real-AI extractor only, not S1-S2.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_s1_s2_real_ai_pilot == true && inputs.confirm_candidate_sha == github.sha }}
    name: One real C2Pro risk extraction (synthetic EPC contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: acc01-s1-s2-real-ai-pilot
      cancel-in-progress: false
    env:
      ENVIRONMENT: test
      C2PRO_AI_MOCK: "0"
      # Settings validation requires these in ENVIRONMENT=test. Non-secret placeholders (same as the gate job): the pilot
      # opens no database or Redis connection, the response cache is disabled.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
      # The tool accepts at most 5,000 characters; Contract A is 2,415.
      RISK_EXTRACTION_MAX_CHARS: "5000"
      ANTHROPIC_API_KEY: ${{ secrets.S2_E2E_ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout dispatched candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require dedicated nonproduction provider credential
        run: |
          set -euo pipefail
          test "${C2PRO_AI_MOCK}" = "0"
          test -n "${ANTHROPIC_API_KEY:-}" || { echo '::error::S2_E2E_ANTHROPIC_API_KEY is unavailable; nothing was sent to a provider.'; exit 2; }
          echo 'Dedicated provider credential is present; its value is never printed.'

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Run exactly one C2Pro extraction without automatic retries
        working-directory: apps/api
        run: python scripts/acc01_real_ai_pilot.py

      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acc01-s1-s2-real-ai-pilot
          path: apps/web/playwright-report/acc01-s1-s2-real-ai-pilot.json
          if-no-files-found: warn
          retention-days: 3

  real-ai-hitl-vertical:
    # Manual-only, triple-confirmed (flag + exact SHA + the owner's phrase). NEVER part of CI. Independent of every other job.
    # One project, one Clerk Development identity that already exists, one document: browser -> REAL provider -> human
    # decisions -> PostgreSQL -> reload/relogin. Every provider call in the API and in the Celery worker goes through the AI
    # call governor (hard cap on calls and USD, no SDK retries, no streaming, no embeddings provider) and is written to a ledger.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_ai_hitl_vertical == true && inputs.confirm_candidate_sha == github.sha && inputs.owner_authorization == 'OWNER-AUTHORIZED-REAL-AI-HITL-VERTICAL' }}
    name: Real AI + browser + HITL + PostgreSQL (one project, governed)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: real-ai-hitl-vertical
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      STORAGE_PROVIDER: local
      AUTH_BOOTSTRAP_ALLOW_FALLBACK_EMERGENCY: "true"
      # REAL provider for inference; embeddings stay mocked (no OPENAI key exists in this job, and the governor refuses the
      # embeddings SDK anyway). The human-review gate is NOT skippable: C2PRO_SKIP_HITL stays 0.
      C2PRO_AI_MOCK: "0"
      C2PRO_EMBEDDINGS_MOCK: "1"
      C2PRO_SKIP_HITL: "0"
      ANTHROPIC_API_KEY: ${{ secrets.S2_E2E_ANTHROPIC_API_KEY }}
      # One output ceiling for every call, below the product default of 8192.
      AI_MAX_TOKENS_OUTPUT: "4096"
      C2PRO_AI_GOVERNOR_LEDGER: ${{ github.workspace }}/apps/web/playwright-report/real-ai-governor-ledger.jsonl
      C2PRO_AI_GOVERNOR_MAX_CALLS: ${{ inputs.governor_max_calls }}
      C2PRO_AI_GOVERNOR_MAX_USD: ${{ inputs.governor_max_usd }}
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      CORS_ORIGINS: '["http://localhost:3100"]'
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout dispatched candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the experiment guards (fail closed before anything starts)
        run: |
          set -euo pipefail
          test "${C2PRO_AI_MOCK}" = "0"
          test "${C2PRO_EMBEDDINGS_MOCK}" = "1"
          test "${C2PRO_SKIP_HITL}" = "0"
          # Caps are positive numbers under hard ceilings; a typo can never widen the experiment.
          python3 - <<'PY'
          import os, sys
          calls, usd = int(os.environ["C2PRO_AI_GOVERNOR_MAX_CALLS"]), float(os.environ["C2PRO_AI_GOVERNOR_MAX_USD"])
          if not (1 <= calls <= 20 and 0 < usd <= 2.0):
              sys.exit(f"::error::governor caps out of bounds: calls={calls} (1..20), usd={usd} (0..2.0]")
          print(f"governor caps accepted: {calls} calls, {usd} USD")
          PY
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then echo '::error::S2_E2E_ANTHROPIC_API_KEY is unavailable; nothing was sent to a provider.'; exit 2; fi
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ] || [ -z "${CLERK_SECRET_KEY:-}" ]; then echo '::error::Clerk Development credentials are missing.'; exit 2; fi
          echo 'Guards hold. Credential values are never printed.'

      - name: Generate ephemeral test JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET_KEY=$secret" >> "$GITHUB_ENV"

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Bootstrap infrastructure (PostgreSQL + Redis, isolated and recreated)
        run: C2PRO_REDIS_TEST_PORT=6379 python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --recreate-db

      # Fails closed unless the Clerk credentials are a development/test instance. The existing E2E identity is used as it is.
      - name: Reconcile dedicated Clerk E2E Organization fixture
        run: python apps/api/scripts/provision_clerk_e2e_fixture.py

      - name: Seed deterministic E2E auth tenancy
        working-directory: apps/api
        run: |
          python - <<'PY'
          import asyncio

          from src.core.database import close_db, get_raw_session, init_db
          from tests.e2e_seed.seed_wedge import seed_e2e_auth_tenancy


          async def main() -> None:
              await init_db()
              try:
                  async with get_raw_session() as db:
                      ids = await seed_e2e_auth_tenancy(db)
                  print(f"seeded tenant={ids['tenant_id']} user={ids['user_id']}")
              finally:
                  await close_db()


          asyncio.run(main())
          PY

      - name: Verify Clerk <-> local tenant linkage
        working-directory: apps/api
        run: python scripts/verify_e2e_tenant_link.py

      # The governor must be live in a fresh interpreter started exactly like the API and the worker. A governor that is
      # not installed would leave the provider uncapped, so this is checked before either process exists.
      - name: AI call governor self-check (no provider call)
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api/scripts/real_ai_governor
        run: |
          python - <<'PY'
          from anthropic.resources.messages import AsyncMessages, Messages
          assert getattr(Messages.create, "_c2pro_governed", False), "sync Messages.create is not governed"
          assert getattr(AsyncMessages.create, "_c2pro_governed", False), "async Messages.create is not governed"
          print("AI call governor is installed in a fresh interpreter")
          PY

      - name: Start Celery worker (document_parsing), governed
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api/scripts/real_ai_governor
        run: |
          python -m celery -A src.core.tasks.celery_app worker \
            --loglevel=info --queues=document_parsing --concurrency=1 \
            > "$RUNNER_TEMP/c2pro-real-ai-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/c2pro-real-ai-worker.pid"
          python - <<'PY'
          import time
          from src.core.tasks.celery_app import celery_app

          deadline = time.monotonic() + 45
          while time.monotonic() < deadline:
              queues = celery_app.control.inspect(timeout=3).active_queues() or {}
              if any(any(q.get("name") == "document_parsing" for q in qs) for qs in queues.values()):
                  print("Celery document_parsing consumer READY")
                  break
              time.sleep(2)
          else:
              print("::error::No responsive Celery consumer for document_parsing after 45s")
              raise SystemExit(1)
          PY

      - name: Start backend API, governed
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api/scripts/real_ai_governor
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP" \
            > "$RUNNER_TEMP/c2pro-real-ai-jwks.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/c2pro-real-ai-jwks.pid"
          CLERK_JWKS_URL=http://127.0.0.1:8765/clerk-jwks.json \
            python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 \
            > "$RUNNER_TEMP/c2pro-real-ai-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/c2pro-real-ai-api.pid"
          for _ in {1..45}; do
            if curl --fail --silent http://localhost:8000/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/c2pro-real-ai-api.log"
          exit 1

      - name: Setup web environment
        uses: ./.github/actions/setup-node-web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # No retries: --retries=0 is explicit. A failure is the finding; it is never re-run here.
      - name: Run the real-AI vertical (browser, REAL provider, human decisions, relogin)
        id: vertical
        working-directory: apps/web
        run: ./node_modules/.bin/playwright test --project=real-ai-hitl --workers=1 --retries=0 --reporter=list

      # A separate process reads PostgreSQL, the manifest and the governor ledger. It runs even if the browser failed: the
      # verdict (and what was spent) must be known either way.
      - name: Verify independently in PostgreSQL and against the provider ledger
        if: always()
        working-directory: apps/api
        run: python scripts/verify_real_ai_hitl_pg.py

      - name: Summarize verdict and consumption
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = pathlib.Path("apps/web/playwright-report")
          print("### Real-AI vertical (nonproduction)")
          try:
              verdict = json.loads((report / "real-ai-hitl-verdict.json").read_text())
              print(f"**Verdict: {verdict['verdict']}** - blocker: {verdict.get('blocker')}")
              for gap in verdict.get("gaps", []):
                  print(f"- GAP `{gap['code']}`: {gap['detail']}")
              for name in verdict.get("failed_checks", []):
                  print(f"- FAILED CHECK: {name}")
          except FileNotFoundError:
              print("No verdict was produced (the verifier did not run to completion).")
          try:
              import sys
              sys.path.insert(0, "apps/api/scripts/real_ai_governor")
              from real_ai_governor import read_events, summarize
              s = summarize(read_events(report / "real-ai-governor-ledger.jsonl"))
              print(f"\nProvider consumption (governor ledger): {s['calls']} call(s), {s['input_tokens']} in / {s['output_tokens']} out tokens, "
                    f"{s['spent_usd']} USD (token-priced estimate, not an invoice), models {s['models']}, refused {s['refused']}")
          except Exception as exc:
              print(f"\nNo ledger readable: {type(exc).__name__}")
          PY

      - name: "Upload sanitized evidence (JSON only, no screenshots, traces, prompts or completions)"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-ai-hitl-vertical
          path: |
            apps/web/playwright-report/real-ai-hitl-vertical.json
            apps/web/playwright-report/real-ai-hitl-verdict.json
            apps/web/playwright-report/real-ai-governor-ledger.jsonl
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          for name in worker api jwks; do
            if [ -f "$RUNNER_TEMP/c2pro-real-ai-$name.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/c2pro-real-ai-$name.pid")" || true
            fi
          done
