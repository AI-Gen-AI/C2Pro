# Test Suite ID: TASK-OPS-DOCFLOW-012
# Real-document operability gate for upload -> analysis -> API/UI readiness.

name: Real Document Operability

on:
  workflow_dispatch:
    inputs:
      run_real_document_flow:
        description: "Run the operator-only real document flow with real fixtures and environment."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      # ACC-01 partial S1-S2 pilot (owner-authorized, one paid extraction). Reuses this manually registered workflow so the
      # branch definition is dispatchable before any new workflow file exists on the default branch.
      run_s1_s2_real_ai_pilot:
        description: "Run ONLY the single real-AI risk extraction (no gates). Needs confirm_candidate_sha."
        required: false
        default: false
        type: boolean
      confirm_candidate_sha:
        description: "Full SHA being dispatched; prevents an accidental paid run."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  C2PRO_AI_MOCK: "1"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  real-document-gate:
    name: Real Document Flow, Coverage, Golden Corpus, and Lint
    if: ${{ !inputs.run_s1_s2_real_ai_pilot }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-magic

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap backend test infrastructure
        run: C2PRO_REDIS_TEST_PORT=6379 python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --recreate-db

      - name: Record operator-only real document status
        if: github.event_name == 'workflow_dispatch' && inputs.run_real_document_flow != 'true'
        run: |
          echo "Real Document Flow | Needs real fixtures + env | No (operator)" >> "$GITHUB_STEP_SUMMARY"

      - name: Real document flow gate
        if: github.event_name == 'workflow_dispatch' && inputs.run_real_document_flow == 'true'
        working-directory: apps/api
        run: python -m pytest tests/integration/document_flow/ -q

      - name: Core AI coverage gate
        working-directory: apps/api
        run: python -m pytest tests/unit/core/ai/ --cov=src/core/ai --cov-report=term-missing --cov-fail-under=70 -q

      - name: Infrastructure coverage gate
        working-directory: apps/api
        run: python -m pytest tests/unit/core/observability tests/unit/core/resilience tests/unit/core/security --cov=src/core/observability --cov=src/core/resilience --cov=src/core/security --cov-report=term-missing --cov-fail-under=70 -q

      - name: Golden corpus eval gate
        working-directory: apps/api
        run: |
          python -m evals.run_evals
          python -m pytest tests/evals/test_golden_corpus.py -q

      - name: Full backend suite gate
        id: full-backend
        continue-on-error: true
        working-directory: apps/api
        run: python -m pytest tests/ -x -q

      - name: Root lint gate
        run: pnpm lint

      - name: Record approved blocker tracking
        if: always()
        run: |
          cat > real-document-operability-blockers.md <<'EOF'
          # Real Document Operability Blockers

          Test Suite ID: TASK-OPS-DOCFLOW-012

          ## Known Tracked Blockers

          - Real Document Flow | Needs real fixtures + env | No (operator)
          - `TASK-COH-V2-VERSIONING-006`: Canonical score-version migration must bootstrap PostgreSQL cleanly before downstream gates can run.

          ## Passing Gates Required Before This Tracking

          - Real document flow: operator dispatch only with `run_real_document_flow=true`; command `python -m pytest tests/integration/document_flow/ -q`
          - Core AI coverage: `python -m pytest tests/unit/core/ai/ --cov=src/core/ai --cov-report=term-missing --cov-fail-under=70 -q`
          - Infrastructure coverage: `python -m pytest tests/unit/core/observability tests/unit/core/resilience tests/unit/core/security --cov=src/core/observability --cov=src/core/resilience --cov=src/core/security --cov-report=term-missing --cov-fail-under=70 -q`
          - Golden corpus: `python -m evals.run_evals` and `python -m pytest tests/evals/test_golden_corpus.py -q`
          - Root lint: `pnpm lint`
          EOF
          cat real-document-operability-blockers.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload golden corpus artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 3
          name: real-document-golden-corpus
          path: |
            evals/results/corpus_results.json
            evals/results/corpus_results.xml

      - name: Upload blocker tracking
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 3
          name: real-document-operability-blockers
          path: real-document-operability-blockers.md

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  s1-s2-real-ai-pilot:
    # Manual-only, double-confirmed, one provider call. NEVER part of CI. Proves the real-AI extractor only, not S1-S2.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_s1_s2_real_ai_pilot == true && inputs.confirm_candidate_sha == github.sha }}
    name: One real C2Pro risk extraction (synthetic EPC contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: acc01-s1-s2-real-ai-pilot
      cancel-in-progress: false
    env:
      ENVIRONMENT: test
      C2PRO_AI_MOCK: "0"
      # Settings validation requires these in ENVIRONMENT=test. Non-secret placeholders (same as the gate job): the pilot
      # opens no database or Redis connection, the response cache is disabled.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
      # The tool accepts at most 5,000 characters; Contract A is 2,415.
      RISK_EXTRACTION_MAX_CHARS: "5000"
      ANTHROPIC_API_KEY: ${{ secrets.S2_E2E_ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout dispatched candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require dedicated nonproduction provider credential
        run: |
          set -euo pipefail
          test "${C2PRO_AI_MOCK}" = "0"
          test -n "${ANTHROPIC_API_KEY:-}" || { echo '::error::S2_E2E_ANTHROPIC_API_KEY is unavailable; nothing was sent to a provider.'; exit 2; }
          echo 'Dedicated provider credential is present; its value is never printed.'

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Run exactly one C2Pro extraction without automatic retries
        working-directory: apps/api
        run: python scripts/acc01_real_ai_pilot.py --out ../web/playwright-report/acc01-s1-s2-real-ai-pilot.json

      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acc01-s1-s2-real-ai-pilot
          path: apps/web/playwright-report/acc01-s1-s2-real-ai-pilot.json
          if-no-files-found: warn
          retention-days: 7
