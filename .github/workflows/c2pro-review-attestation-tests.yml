# Diagnostic slice for #1020: bisect the zero-job workflow parser failure.
# AUDIT_ONLY; no secrets; no review/merge authority.
name: C2Pro Review Attestation Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/development/verify_review_receipts.py"
      - "scripts/development/review_attestation/**"
      - "tests/development/test_review_receipts.py"
      - "tests/development/test_review_attestation_adapter.py"
      - ".github/workflows/c2pro-review-attestation-tests.yml"

permissions:
  contents: read

jobs:
  review-attestation-tests:
    name: Review Attestation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request code for unprivileged tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install bounded test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pyyaml==6.0.3 jsonschema==4.25.1

      - name: Run offline verifier and adapter suites
        shell: bash
        env:
          NO_PROXY: "*"
        run: |
          PYTHONPATH=. pytest --confcutdir=tests/development \
                 tests/development/test_review_receipts.py \
                 tests/development/test_review_attestation_adapter.py -q
          python scripts/development/validate_c2pro_control.py
          python scripts/development/validate_github_actions_storage_policy.py
