# Diagnostic slice for #1020: prove GitHub can parse and create a real job.
# AUDIT_ONLY; no secrets; no review/merge authority.
name: C2Pro Review Attestation Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/development/verify_review_receipts.py"
      - "scripts/development/review_attestation/**"
      - "tests/development/test_review_receipts.py"
      - "tests/development/test_review_attestation_adapter.py"
      - ".github/workflows/c2pro-review-attestation-tests.yml"

permissions:
  contents: read

jobs:
  review-attestation-tests:
    name: Review Attestation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parser diagnostic
        shell: bash
        run: echo "REVIEW_ATTESTATION_WORKFLOW_PARSED=YES"
