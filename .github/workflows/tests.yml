name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  s5-core-ai-gates:
    name: S5 Core AI Gates (I10-I12 + Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run I10-I12 and S5 security gates
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/modules/stakeholders/domain/test_i10_stakeholder_resolution.py \
            tests/modules/stakeholders/application/test_i10_ports_contract.py \
            tests/modules/hitl/domain/test_i11_confidence_gate_routing.py \
            tests/modules/hitl/application/test_i11_review_queue_service.py \
            tests/modules/observability/domain/test_i12_trace_envelope_completeness.py \
            tests/modules/observability/application/test_i12_langsmith_adapter.py \
            tests/modules/observability/application/test_i12_eval_drift_detection.py \
            tests/security/test_i10_stakeholder_raci_security_red.py \
            -v --tb=short --junit-xml=s5-core-ai-gates.xml

      - name: Upload S5 gate results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s5-core-ai-gate-results
          path: apps/api/s5-core-ai-gates.xml
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-magic

      - name: Coherence cache-key SoT guard (ADR-009 §G)
        working-directory: .
        run: |
          set -euo pipefail
          MATCHES=$(grep -rEn 'f"coherence:|f'\''coherence:' apps/api/src/ \
            --include='*.py' \
            | grep -v 'src/coherence/cache_keys.py' \
            | grep -v 'src/coherence/cache_invalidation.py' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::ADR-009 §G violation — ad-hoc coherence cache key literal detected. Use cache_keys.key() instead:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✓ All coherence cache keys go through cache_keys.key()."

      - name: Run unit tests
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/unit/ \
            -m "not integration" \
            -v \
            --tb=short \
            --junit-xml=unit-test-results.xml \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=0

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: apps/api/unit-test-results.xml
          retention-days: 14

      - name: Upload unit coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-py${{ matrix.python-version }}
          path: apps/api/coverage.xml
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-magic

      - name: Bootstrap test infrastructure
        run: |
          python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --recreate-db

      - name: Run integration tests
        working-directory: apps/api
        run: |
          python -m pytest tests/integration/ -v --tb=short --junit-xml=integration-test-results.xml
        continue-on-error: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: apps/api/integration-test-results.xml
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # E2E security and I13 real E2E are owned by their dedicated workflows.
  # tests.yml references their results via the test-summary job.
  # This avoids running the same heavy infra setup twice per push/PR.

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [secrets-scan, s5-core-ai-gates, unit-tests, integration-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Publish test summary
        if: always()
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ET

          total_files = 0
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0

          for path in glob.glob("test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              if not suites:
                  continue
              total_files += 1
              for suite in suites:
                  total_tests += int(suite.attrib.get("tests", 0) or 0)
                  total_failures += int(suite.attrib.get("failures", 0) or 0)
                  total_errors += int(suite.attrib.get("errors", 0) or 0)
                  total_skipped += int(suite.attrib.get("skipped", 0) or 0)

          passed = max(total_tests - total_failures - total_errors - total_skipped, 0)
          lines = [
              "## Test Results Summary",
              f"- Parsed reports: {total_files}",
              f"- Total tests: {total_tests}",
              f"- Passed: {passed}",
              f"- Failed: {total_failures}",
              f"- Errors: {total_errors}",
              f"- Skipped: {total_skipped}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          os.makedirs("release-evidence", exist_ok=True)
          with open("release-evidence/backend-release-summary.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Render quality gate report
        if: always()
        uses: ./.github/actions/quality-report
        with:
          coverage-glob: "test-results/**/coverage.xml"
          junit-glob: "test-results/**/*.xml"
          output: quality-report.md
          fail-on-contract-drop: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

      - name: Comment quality gate report
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: c2pro-quality-report-backend
          path: quality-report.md

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-report
          path: quality-report.md
          retention-days: 90

      - name: Upload backend release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-summary
          path: release-evidence/backend-release-summary.txt
          retention-days: 14
