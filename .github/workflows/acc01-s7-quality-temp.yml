name: TEMP ACC-01 S7 Ruff and mypy parity
on:
  push:
    branches: [feat/acc01-s7-structured-links-20261029]
    paths:
      - .github/workflows/acc01-s7-quality-temp.yml
      - apps/api/src/analysis/application/canonical_structured_wbs_links.py
      - apps/api/tests/integration/analysis/test_s7_structured_wbs_three_source_pg.py
permissions:
  contents: read
jobs:
  quality:
    name: Exact-head backend Ruff + mypy ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-backend
      - name: Ruff on complete backend
        working-directory: apps/api
        run: python -m ruff check .
      - name: Exact baseline mypy ratchet
        working-directory: apps/api
        run: |
          python -m mypy src --no-error-summary --no-color-output > mypy-report.txt || true
          python scripts/mypy_ratchet.py --check mypy-baseline.txt < mypy-report.txt
