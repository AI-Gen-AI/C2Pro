# Owner-authorized operation: source SEC EPC -> deployed Railway pilot.
# No mock, no database seed, no human HITL action.
name: C2Pro REAL SEC Contract to PILOT
on:
  workflow_dispatch:
    inputs:
      owner_authorization:
        description: "Enter OWNER-AUTHORIZED-REAL-PILOT for one real project and document upload"
        required: true
        type: string
      confirmed_sha:
        description: "Commit SHA (40 chars), matched exactly"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: c2pro-real-sec-pilot-one-active
  cancel-in-progress: false
jobs:
  real-pilot-sec:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_authorization == 'OWNER-AUTHORIZED-REAL-PILOT' && inputs.confirmed_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: pilot
    env:
      C2PRO_REAL_PILOT_SEC_UPLOAD: OWNER-AUTHORIZED-REAL-PILOT
      PILOT_API_URL: https://projectgraph-api-pilot.up.railway.app
      ENVIRONMENT: test
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://127.0.0.1:9
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:9
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL || vars.E2E_CLERK_USER_EMAIL }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify scope and nonproduction identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.owner_authorization }}" = "OWNER-AUTHORIZED-REAL-PILOT"
          test "${{ inputs.confirmed_sha }}" = "$GITHUB_SHA"
          test "$PILOT_API_URL" = "https://projectgraph-api-pilot.up.railway.app"
          [[ "$CLERK_SECRET_KEY" == sk_test_* ]] || { echo '::error::DEV Clerk required'; exit 2; }
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_test_* ]] || exit 2
          test -n "$E2E_CLERK_USER_EMAIL" || { echo '::error::Authorized Clerk DEV identity missing'; exit 2; }
      - name: Setup Next.js and Playwright
        uses: ./.github/actions/setup-node-web
      - name: Install Chromium
        working-directory: apps/web
        run: ./node_modules/.bin/playwright install chromium
      - name: Real SEC source to Railway PILOT
        working-directory: apps/web
        run: ./node_modules/.bin/playwright test --project=pilot-sec-real-upload --workers=1 --reporter=list
      - name: Save operational receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2pro-real-sec-pilot-operational-receipt
          path: apps/web/playwright-report/pilot-solarmax-sec-real-receipt.json
          if-no-files-found: warn
          retention-days: 14
