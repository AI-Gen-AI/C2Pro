name: Wireframe Coverage Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/src/tests/wireframes/**"
      - "apps/web/components/**"
      - "apps/web/app/**"
      - "docs/wireframes/0*.md"

concurrency:
  group: wireframe-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wireframe-coverage:
    name: Wireframe TC Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Run wireframe coverage tracker
        run: pnpm dlx tsx apps/web/scripts/wireframe_coverage.ts --ci
        working-directory: ${{ github.workspace }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wireframe-coverage
          path: apps/web/wireframe-coverage.json
          retention-days: 30
