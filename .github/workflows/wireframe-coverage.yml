name: Wireframe Coverage Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/src/tests/wireframes/**"
      - "apps/web/components/**"
      - "apps/web/app/**"
      - "docs/wireframes/0*.md"

concurrency:
  group: wireframe-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wireframe-coverage:
    name: Wireframe TC Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Run wireframe coverage tracker
        run: pnpm dlx tsx apps/web/scripts/wireframe_coverage.ts --ci
        working-directory: ${{ github.workspace }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wireframe-coverage
          path: apps/web/wireframe-coverage.json
          retention-days: 3
