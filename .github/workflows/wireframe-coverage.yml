name: Wireframe Coverage Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/src/tests/wireframes/**"
      - "apps/web/components/**"
      - "apps/web/app/**"
      - "docs/wireframes/0*.md"

concurrency:
  group: wireframe-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wireframe-coverage:
    name: Wireframe TC Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Run wireframe coverage tracker
        run: npx tsx apps/web/scripts/wireframe_coverage.ts --ci
        working-directory: ${{ github.workspace }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wireframe-coverage
          path: apps/web/wireframe-coverage.json
          retention-days: 30
