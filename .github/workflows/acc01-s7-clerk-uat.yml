# QA-ONLY variant of the existing dispatchable workflow, scoped to a disposable
# GitHub Actions runner. Do not merge this test-workflow override to main/S7.
# Real Clerk Development A/B, mock AI, isolated PostgreSQL. No HITL decisions.
name: UX Clerk Development A/B browser gate - isolated QA
on:
  workflow_dispatch:
concurrency:
  group: ux-clerk-browser-gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  s7-clerk:
    name: UX real Clerk A/B, four-source onboarding and mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
      INTEGRAL_CLERK_DEV_B_EMAIL: ${{ secrets.E2E_CLERK_TENANT_B_USER_EMAIL }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      STORAGE_PROVIDER: local
      AUTH_BOOTSTRAP_ALLOW_FALLBACK_EMERGENCY: "true"
      C2PRO_AI_MOCK: "1"
      C2PRO_EMBEDDINGS_MOCK: "1"
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      CORS_ORIGINS: '["http://localhost:3100"]'
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout exact isolated branch SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed if test-only Clerk credentials absent
        run: |
          set -euo pipefail
          test -n "${CLERK_SECRET_KEY:-}" || { echo "::error::S7 Clerk test secret missing"; exit 2; }
          test -n "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" || { echo "::error::S7 Clerk test publishable key missing"; exit 2; }
          test "${C2PRO_AI_MOCK}" = "1" && test "${STORAGE_PROVIDER}" = "local"
      - name: Generate ephemeral test JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET_KEY=$secret" >> "$GITHUB_ENV"
      - name: Set up Python backend
        uses: ./.github/actions/setup-python-backend
      - name: Start isolated PostgreSQL and Redis
        run: C2PRO_REDIS_TEST_PORT=6379 python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --recreate-db
      - name: Provision and verify actual nonproduction Clerk fixture
        run: python apps/api/scripts/provision_clerk_e2e_fixture.py
      # The S7 fixture seeds the local tenant/user rows consumed by the
      # read-only JWT linkage verifier. It records ZERO human approval events.
      # All data remain inside the runner's disposable PostgreSQL database.
      - name: Seed disposable Clerk tenant binding and synthetic sources
        working-directory: apps/api
        run: python -m scripts.seed_s7_clerk_uat
      - name: Verify Clerk organization and tenant binding
        working-directory: apps/api
        run: python scripts/verify_e2e_tenant_link.py
      - name: Start FastAPI and Clerk JWT JWKS fixture
        working-directory: apps/api
        env:
          RATE_LIMIT_PER_MINUTE: "600"
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > "$RUNNER_TEMP/s7-jwks.log" 2>&1 &
          CLERK_JWKS_URL=http://127.0.0.1:8765/clerk-jwks.json python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/s7-api.log" 2>&1 &
          for _ in {1..60}; do
            if curl -fsS http://localhost:8000/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 90 "$RUNNER_TEMP/s7-api.log"
          exit 1
      - name: Setup web environment
        uses: ./.github/actions/setup-node-web
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test UX with real Clerk A/B and isolated PostgreSQL
        id: ux_browser_gate
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/ux-clerk-browser-results.json
        run: ./node_modules/.bin/playwright test --project=ux-clerk-browser-gate --workers=1 --reporter=list,json
      - name: Summarize UAT result without tokens
        if: always()
        working-directory: apps/web
        run: |
          if test -f playwright-report/ux-clerk-browser-results.json; then
            node scripts/playwright-summary.mjs playwright-report/ux-clerk-browser-results.json "UX real Clerk Development A/B browser smoke" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload non-secret Playwright summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-clerk-browser-evidence
          path: apps/web/playwright-report/ux-clerk-browser-results.json
          if-no-files-found: warn
          retention-days: 3
      - name: Cleanup disposable PostgreSQL and Redis
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/s7-worker.pid"; then kill "$(cat "$RUNNER_TEMP/s7-worker.pid")" || true; fi
          docker compose -f docker-compose.test.yml down -v
