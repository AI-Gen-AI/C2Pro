name: C2Pro Development Control

on:
  pull_request:
    branches: [main]
    paths:
      - ".c2pro/**"
      - "core/**"
      - "scripts/development/**"
      - "tests/development/**"
      - "tests/test_single_writer_control_plane.py"
      - "tests/test_g2_reconciler.py"
      - "tests/test_legacy_closure.py"
      - "tests/test_provenance_guard.py"
      - ".github/workflows/c2pro-development-control.yml"
  push:
    branches: [main]
    paths:
      - ".c2pro/**"
      - "core/**"
      - "scripts/development/**"
      - "tests/development/**"
      - "tests/test_single_writer_control_plane.py"
      - "tests/test_g2_reconciler.py"
      - "tests/test_legacy_closure.py"
      - "tests/test_provenance_guard.py"
      - ".github/workflows/c2pro-development-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control:
    name: Validate minimal YAML control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + remote-tracking refs: --verify-against-git needs
          # `origin/main` to resolve and `git merge-base --is-ancestor` to
          # walk real history, which a shallow checkout cannot provide.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal validation dependencies
        run: pip install "pyyaml==6.0.3" "pytest>=9.0.3" "jsonschema>=4.0"

      - name: Validate control and context budget
        run: python scripts/development/validate_c2pro_control.py

      - name: Run development-control regression tests
        run: python -m pytest -q --confcutdir=tests/development tests/development/

      - name: Run G1/G2 governance suites (single-writer control plane, reconciler, legacy closure, provenance guard)
        run: >
          python -m pytest -q --noconftest
          tests/test_single_writer_control_plane.py
          tests/test_g2_reconciler.py
          tests/test_legacy_closure.py
          tests/test_provenance_guard.py

      # Runs LAST and deliberately un-gated by the steps above: this is a
      # data-freshness signal (is the canonical ledger caught up with Git),
      # not a code-correctness one, and the two must not be conflated in one
      # pass/fail.
      #
      # Semantics (baseline.main_sha means "the main commit consumed as
      # INPUT to the current work cycle", not "the SHA of the commit
      # containing current.yaml" -- the two are necessarily different for
      # one commit immediately after current.yaml's own change merges to
      # main, since that merge/squash commit cannot equal its own recorded
      # value at commit time):
      #   - active_work non-empty  -> baseline.main_sha MUST equal
      #     origin/main exactly; any advancement of main requires an
      #     explicit reconciliation before active work continues.
      #   - active_work empty      -> baseline.main_sha may be an ancestor
      #     of origin/main (the legitimate post-merge/idle state this very
      #     job runs in immediately after a G2 reconciliation PR merges).
      #   - not even an ancestor, or missing entirely -> always fails,
      #     regardless of active_work.
      - name: Validate canonical baseline against Git truth
        run: python scripts/development/validate_c2pro_control.py --verify-against-git
