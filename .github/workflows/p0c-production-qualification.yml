name: P0c Production Qualification

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type RUN-ISSUE-686 to authorize the bounded P0c production journey."
        required: true
        type: string
      backend_commit_sha:
        description: "Expected Railway production Git SHA observed independently."
        required: true
        type: string
      backend_deployment_id:
        description: "Expected Railway API production deployment ID."
        required: true
        type: string
      frontend_commit_sha:
        description: "Expected Vercel production Git SHA observed independently."
        required: true
        type: string
      frontend_deployment_id:
        description: "Expected Vercel production deployment ID."
        required: true
        type: string
      railway_staged_changes_clear:
        description: "Operator verified Railway has no effective staged production changes."
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: c2pro-p0c-production-qualification
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PROD_ACCEPTANCE_BASE_URL: "https://c2pro.io"
  PROD_ACCEPTANCE_RAILWAY_ENVIRONMENT_ID: "ecd39af1-2501-4b9b-8e2e-fafcc6a66570"
  PROD_ACCEPTANCE_RAILWAY_API_SERVICE_ID: "dd372d3a-fb0a-4953-862b-63a10b9058ad"
  PROD_ACCEPTANCE_RAILWAY_WORKER_SERVICE_ID: "e2fac2e9-e9f7-42a8-b022-3c9309d0c763"
  PROD_ACCEPTANCE_RAILWAY_SCHEDULER_SERVICE_ID: "d7952082-b1b3-46f4-b916-c66c8329452c"
  PROD_ACCEPTANCE_VERCEL_TEAM_ID: "team_OD4wmtP2vMrbaA8K5C3WcVET"
  PROD_ACCEPTANCE_VERCEL_PROJECT_ID: "prj_3CgujYjdedPU5ThQFi4JqHmnlwAr"

jobs:
  p0c-production-qualification:
    name: "#686 P0c exact-runtime What Changed"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-qualification

    steps:
      - name: Fail closed on authority and exact inputs
        env:
          CONFIRM: ${{ inputs.confirm_production }}
          STAGED_CLEAR: ${{ inputs.railway_staged_changes_clear }}
          BACKEND_SHA: ${{ inputs.backend_commit_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_commit_sha }}
          BACKEND_DEPLOYMENT: ${{ inputs.backend_deployment_id }}
          FRONTEND_DEPLOYMENT: ${{ inputs.frontend_deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RUN-ISSUE-686"
          test "${GITHUB_REF_NAME}" = "main"
          test "$STAGED_CLEAR" = "true"
          [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_DEPLOYMENT" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$FRONTEND_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]{20,64}$ ]]

      - name: Fail closed on protected qualification prerequisites
        env:
          RAILWAY_TOKEN: ${{ secrets.PROD_ACCEPTANCE_RAILWAY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.PROD_ACCEPTANCE_VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          CLERK_ORG_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
          CLERK_EMAIL: ${{ secrets.PROD_ACCEPTANCE_CLERK_EMAIL }}
          CLERK_PASSWORD: ${{ secrets.PROD_ACCEPTANCE_CLERK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RAILWAY_TOKEN VERCEL_TOKEN DATABASE_URL TENANT_ID CLERK_ORG_ID CLERK_EMAIL CLERK_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected prerequisite: $name" >&2; exit 2; }
          done
          echo "Protected prerequisites present; values withheld."

      - name: Checkout exact control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind control commit to canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -f validation/product/c2pro-master-product-control-v1.yaml
          echo "CONTROL_COMMIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Observe current provider deployment identities
        env:
          RAILWAY_TOKEN: ${{ secrets.PROD_ACCEPTANCE_RAILWAY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.PROD_ACCEPTANCE_VERCEL_TOKEN }}
          FRONTEND_DEPLOYMENT: ${{ inputs.frontend_deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/product-qualification/runtime/provider

          railway_graphql() {
            local payload="$1"
            local output="$2"
            local candidate="${output}.candidate"
            rm -f "$candidate"
            for mode in bearer project; do
              if [ "$mode" = bearer ]; then
                header_name="Authorization"
                header_value="Bearer ${RAILWAY_TOKEN}"
              else
                header_name="Project-Access-Token"
                header_value="${RAILWAY_TOKEN}"
              fi
              if curl --fail --silent --show-error                 --request POST                 --url "https://backboard.railway.com/graphql/v2"                 --header "${header_name}: ${header_value}"                 --header "Content-Type: application/json"                 --data "$payload"                 --output "$candidate"; then
                if jq -e '((.errors // []) | length == 0) and ((.data.serviceInstance.latestDeployment.id? // "") | length > 0)' "$candidate" >/dev/null; then
                  mv "$candidate" "$output"
                  return 0
                fi
              fi
            done
            echo "Railway provider observation failed." >&2
            rm -f "$candidate"
            return 1
          }

          service_query='query serviceInstance($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { latestDeployment { id status meta } } }'
          for pair in             "api:${PROD_ACCEPTANCE_RAILWAY_API_SERVICE_ID}"             "worker:${PROD_ACCEPTANCE_RAILWAY_WORKER_SERVICE_ID}"             "scheduler:${PROD_ACCEPTANCE_RAILWAY_SCHEDULER_SERVICE_ID}"
          do
            name="${pair%%:*}"
            service_id="${pair#*:}"
            payload="$(jq -cn               --arg q "$service_query"               --arg environment "$PROD_ACCEPTANCE_RAILWAY_ENVIRONMENT_ID"               --arg service "$service_id"               '{query:$q,variables:{serviceId:$service,environmentId:$environment}}')"
            railway_graphql "$payload" "evidence/product-qualification/runtime/provider/railway-${name}.json"
          done

          curl --fail --silent --show-error             --url "https://api.vercel.com/v13/deployments/${FRONTEND_DEPLOYMENT}?teamId=${PROD_ACCEPTANCE_VERCEL_TEAM_ID}"             --header "Authorization: Bearer ${VERCEL_TOKEN}"             --output evidence/product-qualification/runtime/provider/vercel-frontend.json

      - name: Verify independently observed deployment identities
        env:
          BACKEND_SHA: ${{ inputs.backend_commit_sha }}
          BACKEND_DEPLOYMENT: ${{ inputs.backend_deployment_id }}
          FRONTEND_SHA: ${{ inputs.frontend_commit_sha }}
          FRONTEND_DEPLOYMENT: ${{ inputs.frontend_deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          python validation/product/verify_prod_deployment_identity.py             --expected-backend-sha "$BACKEND_SHA"             --expected-api-deployment "$BACKEND_DEPLOYMENT"             --expected-frontend-sha "$FRONTEND_SHA"             --expected-frontend-deployment "$FRONTEND_DEPLOYMENT"             --expected-frontend-project "$PROD_ACCEPTANCE_VERCEL_PROJECT_ID"
          echo "PROD_ACCEPTANCE_OBSERVED_BACKEND_SHA=$BACKEND_SHA" >> "$GITHUB_ENV"
          echo "PROD_ACCEPTANCE_OBSERVED_FRONTEND_SHA=$FRONTEND_SHA" >> "$GITHUB_ENV"

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: "3.11"
          install-system-deps: "false"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install production qualification browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve deterministic Contract A/B hashes
        shell: bash
        run: |
          set -euo pipefail
          source_hash="$(sha256sum apps/web/src/tests/e2e/test-data/pj01/contract-a.pdf | awk '{print $1}')"
          target_hash="$(sha256sum apps/web/src/tests/e2e/test-data/pj01/contract-b.pdf | awk '{print $1}')"
          test "$source_hash" != "$target_hash"
          echo "P0C_SOURCE_BLOB_HASH=$source_hash" >> "$GITHUB_ENV"
          echo "P0C_TARGET_BLOB_HASH=$target_hash" >> "$GITHUB_ENV"

      - name: Read-only synthetic tenant preflight
        env:
          PROD_ACCEPTANCE_DATABASE_URL_READONLY: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python apps/api/scripts/verify_prod_synthetic_journey.py \
            --tenant-id "$PROD_ACCEPTANCE_EXPECTED_TENANT_ID" \
            --clerk-org-id "$PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID" \
            --allow-project-prefix "P0c Qualification "
          echo "PROD_ACCEPTANCE_TENANT_PREFLIGHT_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Execute real P0c production browser journey
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: "https://c2pro.io"
          PROD_ACCEPTANCE_CLERK_EMAIL: ${{ secrets.PROD_ACCEPTANCE_CLERK_EMAIL }}
          PROD_ACCEPTANCE_CLERK_PASSWORD: ${{ secrets.PROD_ACCEPTANCE_CLERK_PASSWORD }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
          PROD_ACCEPTANCE_TENANT_PREFLIGHT_VERIFIED: "1"
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright test             src/tests/e2e/prod-acceptance/686-p0c-production.spec.ts             --project=p0c-prod-acceptance             --reporter=line             --workers=1

      - name: Resolve browser-observed durable identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path("apps/web/playwright/.prod-acceptance/p0c-run.json").read_text())
          for env, key in [
              ("P0C_PROJECT_ID", "project_id"),
              ("P0C_DOCUMENT_ID", "document_id"),
              ("P0C_SOURCE_REVISION_ID", "source_revision_id"),
              ("P0C_TARGET_REVISION_ID", "target_revision_id"),
              ("P0C_CHANGE_EVENT_ID", "change_event_id"),
          ]:
              value = data.get(key)
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"missing {key}")
              print(f"{env}={value}")
          PY

      - name: Read-only durable P0c post-run verification
        env:
          PROD_ACCEPTANCE_DATABASE_URL_READONLY: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python apps/api/scripts/verify_p0c_prod_qualification.py             --project-id "$P0C_PROJECT_ID"             --document-id "$P0C_DOCUMENT_ID"             --source-revision-id "$P0C_SOURCE_REVISION_ID"             --target-revision-id "$P0C_TARGET_REVISION_ID"             --change-event-id "$P0C_CHANGE_EVENT_ID"             --source-blob-hash "$P0C_SOURCE_BLOB_HASH"             --target-blob-hash "$P0C_TARGET_BLOB_HASH"             --write-evidence

      - name: Build non-authoritative P0c evidence bundle
        env:
          BACKEND_SHA: ${{ inputs.backend_commit_sha }}
          BACKEND_DEPLOYMENT: ${{ inputs.backend_deployment_id }}
          FRONTEND_SHA: ${{ inputs.frontend_commit_sha }}
          FRONTEND_DEPLOYMENT: ${{ inputs.frontend_deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          python validation/product/build_p0c_prod_qualification_bundle.py             --control-commit-sha "$CONTROL_COMMIT_SHA"             --backend-commit-sha "$BACKEND_SHA"             --backend-deployment-id "$BACKEND_DEPLOYMENT"             --frontend-commit-sha "$FRONTEND_SHA"             --frontend-deployment-id "$FRONTEND_DEPLOYMENT"             --github-run-id "$GITHUB_RUN_ID"             --github-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Validate qualification evidence contract
        run: python validation/product/validate_qualification_evidence.py

      - name: Emit bounded run summary
        if: always()
        env:
          BACKEND_DEPLOYMENT: ${{ inputs.backend_deployment_id }}
          BACKEND_SHA: ${{ inputs.backend_commit_sha }}
          FRONTEND_DEPLOYMENT: ${{ inputs.frontend_deployment_id }}
          FRONTEND_SHA: ${{ inputs.frontend_commit_sha }}
        shell: bash
        run: |
          {
            echo "## C2Pro #686 P0c Production Qualification"
            echo
            echo "- backend: `$BACKEND_DEPLOYMENT` @ `$BACKEND_SHA`"
            echo "- frontend: `$FRONTEND_DEPLOYMENT` @ `$FRONTEND_SHA`"
            echo "- journey: fresh synthetic project -> Contract A -> same-document Contract B -> What Changed -> relogin"
            echo "- no existing P0b project is mutated"
            echo "- lifecycle authority: **false**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded P0c qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 3
          name: c2pro-686-p0c-production-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            apps/web/playwright/.prod-acceptance/p0c-run.json
            apps/web/playwright/.prod-acceptance/p0c/**
            evidence/product-qualification/runtime/p0c-verifier.json
            evidence/product-qualification/runtime/deployment-identity.json
            evidence/product-qualification/runtime/provider/*.json
            evidence/product-qualification/p0c-prod-gh-*.yaml
