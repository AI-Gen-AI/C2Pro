# C2Pro CI — single PR/push validation pipeline.
#
# Replaces the former tests.yml, e2e-security-tests.yml, frontend-ci.yml and
# frontend-e2e.yml. Design notes:
#
#   * detect-changes path-filters the monorepo (backend / frontend / migrations)
#     so docs-only PRs finish in under a minute. The workflow itself has NO
#     `paths:` trigger filter on purpose: the final `ci-status` join job must
#     always report, because it is the single required branch-protection check.
#   * Advisory (non-gating) jobs: none (frontend-build promoted to required 2026-07-19;
#     TASK-DEV-018 — no CI job previously ran `next build`, only Vercel at deploy
#     time; advisory until it has run green for a while, then promote to
#     REQUIRED_JOBS). backend-typecheck (mypy ratchet) was promoted to required
#     after EPIC-MYPY-STRICT (main at new=0). backend-lint was promoted to required
#     2026-07-27 (strict zero baseline after TASK-DEV-030 / V3-P0-04) and
#     backend-integration 2026-07-16 (suite green after TASK-DEV-004).
#     ci-status enumerates required jobs explicitly; advisory jobs are excluded.
#   * Secret scanning is owned by secret-scan.yml; OpenAPI drift by
#     openapi-drift.yml; deeper eval/E2E suites by their dedicated workflows.
#
# Adding a new app/service later: add a filter key in detect-changes, add jobs
# that `needs: detect-changes` + use the setup composites, and list the new
# gating jobs in ci-status `needs` + REQUIRED_JOBS. See docs/runbooks/ci-cd-setup.md.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded PR runs; never cancel main/develop pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      migrations: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            backend:
              - "apps/api/**"
              - "docker-compose.test.yml"
              - "infrastructure/database/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/setup-python-backend/**"
            frontend:
              - "apps/web/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
              - ".github/actions/setup-node-web/**"
            migrations:
              - "apps/api/alembic/**"
              - "supabase/migrations/**"

  # ──────────────────────────── Backend lane ────────────────────────────

  # Required gate (promoted from advisory on 2026-07-15, TASK-DEV-009).
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Install the exact ruff version pinned in apps/api/requirements.txt so
      # the job always matches the project toolchain (survives Dependabot bumps).
      - name: Install ruff (version from requirements.txt)
        run: pip install "$(grep -E '^ruff==' apps/api/requirements.txt)"

      - name: Ruff check
        working-directory: apps/api
        run: python -m ruff check .

  # EPIC-MYPY-STRICT Wave 0 (TASK-DEV-031). Runs strict mypy with the FULL backend
  # dependency graph (so types resolve — the old job installed only mypy, which
  # degraded missing imports to Any) and gates via a ratchet: the ~1,364 existing
  # errors live in apps/api/mypy-baseline.txt; the job fails only on NEW ones.
  # REQUIRED gate: with main at new=0, any PR that regresses typing fails the ratchet
  # and cannot merge. Promoted from advisory after the EPIC-MYPY-STRICT campaign drained
  # the queue (TASK-DEV-006 / QA-322). CI (Linux) is the sole arbiter of new=0.
  backend-typecheck:
    name: Backend Typecheck (mypy ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Full backend env so mypy sees the real type surface (SQLAlchemy, Pydantic,
      # FastAPI, ...), matching local runs. This is the CI-parity fix.
      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Mypy ratchet (fail only on NEW errors vs baseline)
        working-directory: apps/api
        run: |
          set -euo pipefail
          # mypy always exits non-zero while baseline errors remain, so capture
          # its output (|| true) and let the ratchet's exit code gate the job.
          python -m mypy src --no-error-summary --no-color-output > mypy-report.txt || true
          python scripts/mypy_ratchet.py --check mypy-baseline.txt < mypy-report.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The baseline is Linux/CI-canonical (mypy drifts across platforms — e.g.
      # Starlette Request typing). Publish the raw Linux report so a maintainer
      # can refresh the baseline reproducibly: download it and run
      #   python apps/api/scripts/mypy_ratchet.py --update apps/api/mypy-baseline.txt < mypy-report.txt
      - name: Upload mypy report (Linux-canonical baseline source)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy-report
          path: apps/api/mypy-report.txt
          if-no-files-found: warn

  backend-unit:
    name: Backend Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        # PRs run the production Python only; pushes to main/develop keep the
        # forward-compat 3.12 leg.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ matrix.python-version }}

      - name: Coherence cache-key SoT guard (ADR-009 §G)
        run: |
          set -euo pipefail
          MATCHES=$(grep -rEn 'f"coherence:|f'\''coherence:' apps/api/src/ \
            --include='*.py' \
            | grep -v 'src/coherence/cache_keys.py' \
            | grep -v 'src/coherence/cache_invalidation.py' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::ADR-009 §G violation — ad-hoc coherence cache key literal detected. Use cache_keys.key() instead:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✓ All coherence cache keys go through cache_keys.key()."

      - name: ADR-013 graph node contract gate
        working-directory: apps/api
        run: python -m pytest tests/contract/test_graph_node_contracts.py -v --tb=short

      - name: S5 core AI gates (I10-I12 + security)
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/modules/stakeholders/domain/test_i10_stakeholder_resolution.py \
            tests/modules/stakeholders/application/test_i10_ports_contract.py \
            tests/modules/hitl/domain/test_i11_confidence_gate_routing.py \
            tests/modules/hitl/application/test_i11_review_queue_service.py \
            tests/modules/observability/domain/test_i12_trace_envelope_completeness.py \
            tests/modules/observability/application/test_i12_langsmith_adapter.py \
            tests/modules/observability/application/test_i12_eval_drift_detection.py \
            tests/security/test_i10_stakeholder_raci_security_red.py \
            --tb=short --junit-xml=s5-core-ai-gates.xml

      - name: Run unit tests
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/unit/ \
            -m "not integration" \
            --tb=short \
            --junit-xml=unit-test-results.xml \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered

      - name: Upload unit test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: |
            apps/api/unit-test-results.xml
            apps/api/s5-core-ai-gates.xml
          retention-days: 14

      - name: Upload unit coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-coverage-py${{ matrix.python-version }}
          path: |
            apps/api/coverage.xml
            apps/api/.coverage
          include-hidden-files: true
          retention-days: 14

  # SEC-003: CI verification that the Presidio NER gate actually runs (not silently
  # degraded to regex-only). Mirrors Dockerfile:39 by downloading es_core_news_md,
  # then runs ONLY the presidio test file so the ~100MB model download is isolated
  # from all other backend lanes. The model is cached by spaCy version (derived from
  # requirements.txt hash) so subsequent runs restore from cache in seconds.
  # NOTE: actions/cache uses a tag reference below — pin to a SHA before merging,
  # following the project convention (see other actions in this file).
  backend-presidio-ner:
    name: Backend Presidio NER Gate (SEC-003)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Get Python site-packages path and spaCy version for cache key
        id: spacy-meta
        shell: bash
        run: |
          echo "site=$(python -c 'import sysconfig; print(sysconfig.get_path(\"purelib\"))')" >> $GITHUB_OUTPUT
          echo "ver=$(python -c 'import spacy; print(spacy.__version__)')" >> $GITHUB_OUTPUT

      - name: Cache es_core_news_md spaCy model
        id: spacy-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.spacy-meta.outputs.site }}/es_core_news_md
          key: spacy-es-core-news-md-${{ runner.os }}-${{ steps.spacy-meta.outputs.ver }}
          restore-keys: spacy-es-core-news-md-${{ runner.os }}-

      - name: Download es_core_news_md spaCy NER model (mirrors Dockerfile:39)
        if: steps.spacy-cache.outputs.cache-hit != 'true'
        run: python -m spacy download es_core_news_md

      - name: Run Presidio NER gate tests (SEC-003)
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/unit/core/test_privacy_anonymizer_presidio.py \
            -v --tb=short \
            --junit-xml=presidio-ner-test-results.xml

      - name: Upload Presidio NER test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presidio-ner-test-results
          path: apps/api/presidio-ner-test-results.xml
          retention-days: 14

  backend-security:
    name: Backend Security Suite (multi-tenant isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      AUTH_BOOTSTRAP_ALLOW_FALLBACK_EMERGENCY: "true"
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.test.mock
      SUPABASE_SERVICE_ROLE_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.test.mock.service
      ANTHROPIC_API_KEY: sk-ant-test-mock-key
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "100"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Bootstrap test infrastructure
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --redis-port 6379 --recreate-db

      - name: Run multi-tenant isolation and auth security tests
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/e2e/security/test_multi_tenant_isolation.py \
            tests/core/auth/test_jwt_validator.py \
            tests/core/test_middleware.py \
            tests/core/test_clerk_auth_and_rate_limiter.py \
            --tb=short \
            --cov=src/core/middleware \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junit-xml=security-test-results.xml

      - name: Upload security test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-security-results
          path: apps/api/security-test-results.xml
          retention-days: 14

      - name: Database logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml ps || true
          docker compose -f docker-compose.test.yml logs postgres-test || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Required gate (promoted from advisory 2026-07-16, TASK-DEV-004). The suite is
  # green on main (0 failed / 0 errors) after the tenant_id fixture, WBS nested-set,
  # alerts/langsmith router-contract, and datetime-tz repairs.
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      DEBUG: "true"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      - name: Bootstrap test infrastructure
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --redis-port 6379 --recreate-db

      - name: Run integration tests
        working-directory: apps/api
        run: python -m pytest tests/integration/ --tb=short --junit-xml=integration-test-results.xml

      - name: Upload integration test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: apps/api/integration-test-results.xml
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  backend-core:
    name: Backend Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      C2PRO_AI_MOCK: "1"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend
      - name: Bootstrap test infrastructure
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --redis-port 6379 --recreate-db
      - name: Run core tests
        working-directory: apps/api
        run: python -m pytest tests/core --tb=short --junit-xml=core-test-results.xml --cov=src --cov-report=xml:coverage.xml
      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-test-results
          path: apps/api/core-test-results.xml
      - name: Upload core coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage
          path: apps/api/.coverage
          include-hidden-files: true
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  backend-coherence:
    name: Backend Coherence Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      C2PRO_AI_MOCK: "1"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend
      - name: Bootstrap test infrastructure
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --redis-port 6379 --recreate-db
      - name: Run coherence tests
        working-directory: apps/api
        run: python -m pytest tests/coherence --tb=short --junit-xml=coherence-test-results.xml --cov=src --cov-report=xml:coverage.xml
      - name: Upload coherence test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coherence-test-results
          path: apps/api/coherence-test-results.xml
      - name: Upload coherence coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coherence-coverage
          path: apps/api/.coverage
          include-hidden-files: true
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  backend-modules:
    name: Backend Modules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      C2PRO_AI_MOCK: "1"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend
      - name: Bootstrap test infrastructure
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --redis-port 6379 --recreate-db
      - name: Run modules tests
        working-directory: apps/api
        run: python -m pytest tests/modules -m "not requires_services" --tb=short --junit-xml=modules-test-results.xml --cov=src --cov-report=xml:coverage.xml
      - name: Upload modules test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modules-test-results
          path: apps/api/modules-test-results.xml
      - name: Upload modules coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modules-coverage
          path: apps/api/.coverage
          include-hidden-files: true
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Merge the reports from separately-gated suites. A per-suite fail-under
  # would measure mostly unrelated source files rather than project coverage.
  backend-coverage:
    name: Backend Combined Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, backend-unit, backend-core, backend-coherence, backend-modules]
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend
      - name: Download Python 3.11 unit coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-coverage-py3.11
          path: apps/api/coverage-data/unit
      - name: Download core coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-coverage
          path: apps/api/coverage-data/core
      - name: Download coherence coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coherence-coverage
          path: apps/api/coverage-data/coherence
      - name: Download modules coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: modules-coverage
          path: apps/api/coverage-data/modules
      - name: Merge and enforce backend coverage ratchet
        working-directory: apps/api
        run: |
          coverage combine coverage-data/unit/.coverage coverage-data/core/.coverage coverage-data/coherence/.coverage coverage-data/modules/.coverage
          coverage report --fail-under=70
          coverage xml -o merged-coverage.xml
      - name: Upload merged backend coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-combined-coverage
          path: apps/api/merged-coverage.xml
          retention-days: 14
      - name: Upload merged backend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/api/merged-coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  backend-migrations:
    name: Migrations Check (Alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    # alembic/env.py (and the single-head regression test) import
    # src.config.settings, whose only required field is JWT_SECRET_KEY. Without
    # it, `alembic upgrade head` aborts at Settings validation before applying
    # any migration. This job previously "passed" only because it was skipped on
    # non-migration PRs; provide the test env so the lane actually runs.
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend environment
        uses: ./.github/actions/setup-python-backend

      # bootstrap_test_infra.py recreates the DB, runs `alembic upgrade head`
      # from scratch, asserts the applied revision is the single head, and
      # validates the migration graph is linear. This turns the "dual Alembic
      # heads crash-loop on Railway boot" failure mode into a PR-time failure.
      - name: Apply migrations from scratch and validate single head
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --recreate-db

      - name: Single-head regression test
        working-directory: apps/api
        run: python -m pytest tests/unit/test_alembic_single_head.py -q

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ─────────────────────────── Frontend lane ───────────────────────────

  frontend-quality:
    name: Frontend Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsubW9jay5sb2NhbCQ
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup web environment
        uses: ./.github/actions/setup-node-web

      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      # ADR-009 §18: Coherence Score™ paths must never collapse null → 0.
      # Bans `?? 0` / `|| 0` in coherence components. Weight fallbacks
      # (`weights_used[cat] ?? 0`) are allowed because they apply to
      # percentages, not score values.
      - name: Coherence score-path null-fallback guard (ADR-009 §18)
        run: |
          set -euo pipefail
          MATCHES=$(grep -rEn '\?\? *0([^.0-9]|$)|\|\| *0([^.0-9]|$)' \
            apps/web/components/coherence/ \
            apps/web/lib/api/contracts.ts \
            --include='*.tsx' --include='*.ts' \
            | grep -v 'weights_used' \
            | grep -v '\.test\.' \
            | grep -v 'test-utils' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::ADR-009 §18 violation — '?? 0' or '|| 0' detected on a Coherence Score™ path:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✓ No null→0 collapses on coherence score paths."

  frontend-test:
    name: Frontend Tests + API Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsubW9jay5sb2NhbCQ' }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsubW9jay5sb2NhbCQ' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup web environment
        uses: ./.github/actions/setup-node-web

      - name: Unit and integration tests
        working-directory: apps/web
        run: pnpm test:all

      - name: Enforce frontend coverage ratchet
        working-directory: apps/web
        run: pnpm test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/web/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: API generation drift check
        working-directory: apps/web
        run: pnpm generate:api:check

  frontend-e2e-smoke:
    name: Frontend E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      ENVIRONMENT: test
      C2PRO_AI_MOCK: "1"
      JWT_SECRET_KEY: test-secret-key-min-32-chars-required-for-testing-purposes-only
      AUTH_BOOTSTRAP_ALLOW_FALLBACK_EMERGENCY: "true"
      REDIS_URL: redis://localhost:6379/0
      # Browser calls must use the Next.js proxy so the Clerk bearer token is
      # forwarded to the local backend without a cross-origin preflight.
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_URL: http://localhost:8000
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The selected E2E specs supply deterministic browser-route fixtures, but
      # auth setup and proxy calls must still have a live backend available.
      - name: Setup backend environment
        if: ${{ vars.RUN_FULL_E2E == 'true' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') && env.CLERK_SECRET_KEY != '' }}
        uses: ./.github/actions/setup-python-backend

      - name: Bootstrap E2E backend infrastructure
        if: ${{ vars.RUN_FULL_E2E == 'true' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') && env.CLERK_SECRET_KEY != '' }}
        run: python apps/api/scripts/bootstrap_test_infra.py --start-services --require-redis --redis-port 6379 --recreate-db

      - name: Resolve Clerk E2E user
        if: ${{ vars.RUN_FULL_E2E == 'true' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') && env.CLERK_SECRET_KEY != '' }}
        run: |
          CLERK_E2E_USER_ID=$(curl -fsS "https://api.clerk.com/v1/users?email_address=testuser@c2pro.com" \
            -H "Authorization: Bearer ${CLERK_SECRET_KEY}" | jq -r '.[0].id')
          test -n "$CLERK_E2E_USER_ID" && test "$CLERK_E2E_USER_ID" != "null"
          echo "CLERK_E2E_USER_ID=$CLERK_E2E_USER_ID" >> "$GITHUB_ENV"

      - name: Seed FRT-192 full-stack E2E wedge
        if: ${{ vars.RUN_FULL_E2E == 'true' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') && env.CLERK_SECRET_KEY != '' }}
        working-directory: apps/api
        run: |
          python - <<'PY'
          import asyncio
          import hashlib
          import json
          import os
          from pathlib import Path

          import httpx
          from sqlalchemy import func, select

          from src.core.auth.models import Tenant, User
          from src.core.database import close_db, get_raw_session, init_db
          from src.documents.adapters.persistence.models import DocumentORM
          from src.projects.adapters.persistence.models import ProjectORM
          from tests.e2e_seed.seed_wedge import PROJECT_ID, TENANT_ID, USER_ID, seed_wedge_e2e


          async def main() -> None:
              database_url_hash = hashlib.sha256(os.environ["DATABASE_URL"].encode()).hexdigest()
              print(f"FRT-192 seed DATABASE_URL_SHA256={database_url_hash}")
              async with httpx.AsyncClient(timeout=30.0) as client:
                  jwks_response = await client.get(
                      "https://api.clerk.com/v1/jwks",
                      headers={"Authorization": f"Bearer {os.environ['CLERK_SECRET_KEY']}"},
                  )
                  jwks_response.raise_for_status()
                  Path(os.environ["RUNNER_TEMP"], "clerk-jwks.json").write_text(
                      json.dumps(jwks_response.json()), encoding="utf-8"
                  )

              clerk_user_id = os.environ["CLERK_E2E_USER_ID"]

              await init_db()
              try:
                  async with get_raw_session() as db:
                      await seed_wedge_e2e(db)
                      user = await db.get(User, USER_ID)
                      if user is None:
                          raise RuntimeError("FRT-192 seed user was not created")
                      tenant = await db.get(Tenant, user.tenant_id)
                      if tenant is None:
                          raise RuntimeError("FRT-192 seed tenant was not created")
                      user.clerk_user_id = clerk_user_id
                      # Match the existing no-organization Clerk provisioning policy so
                      # the authenticated test user resolves to the seeded tenant.
                      tenant.name = f"Personal-{clerk_user_id}"
                      await db.commit()

                  # The backend runs in a different process and connection.  Verify
                  # committed visibility from a fresh session before it starts.
                  async with get_raw_session() as verification_db:
                      matching_users = await verification_db.scalar(
                          select(func.count()).select_from(User).where(User.clerk_user_id == clerk_user_id)
                      )
                      user = await verification_db.get(User, USER_ID)
                      document_count = await verification_db.scalar(
                          select(func.count()).select_from(DocumentORM).where(
                              DocumentORM.project_id == PROJECT_ID,
                              DocumentORM.tenant_id == TENANT_ID,
                          )
                      )
                      project = await verification_db.get(ProjectORM, PROJECT_ID)
                      if (
                          matching_users != 1
                          or user is None
                          or user.tenant_id != TENANT_ID
                          or project is None
                          or document_count != 3
                      ):
                          raise RuntimeError(
                              "FRT-192 seed diagnostic failed: "
                              f"users={matching_users} tenant={user.tenant_id if user else None} "
                              f"project={project is not None} documents={document_count}"
                          )
                      print(
                          "FRT-192 fresh-session seed diagnostic: "
                          f"clerk_user_id={clerk_user_id} tenant_id={user.tenant_id} "
                          f"project_id={PROJECT_ID} documents={document_count}"
                      )
              finally:
                  await close_db()


          asyncio.run(main())
          PY

      - name: Start E2E backend
        if: ${{ vars.RUN_FULL_E2E == 'true' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') && env.CLERK_SECRET_KEY != '' }}
        run: |
          printf 'FRT-192 backend DATABASE_URL_SHA256=%s\n' "$(printf %s "$DATABASE_URL" | sha256sum | cut -d' ' -f1)"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP" \
            > "$RUNNER_TEMP/c2pro-e2e-jwks.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/c2pro-e2e-jwks.pid"
          (
            cd apps/api
            CLERK_JWKS_URL=http://127.0.0.1:8765/clerk-jwks.json \
              python -m uvicorn src.main:app --host 127.0.0.1 --port 8000
          ) > "$RUNNER_TEMP/c2pro-e2e-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/c2pro-e2e-api.pid"
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/c2pro-e2e-api.log"
          exit 1

      - name: Setup web environment
        uses: ./.github/actions/setup-node-web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # QA-338/FRT-192: keep this required lane opt-in until an operator enables
      # the repository variable after the live run is certified. The seeded
      # backend covers auth/proxy availability without using a real Claude call.
      - name: E2E smoke tests
        if: ${{ vars.RUN_FULL_E2E == 'true' && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && (env.CLERK_SECRET_KEY != '' || env.CLERK_TESTING_TOKEN != '') && env.CLERK_SECRET_KEY != '' }}
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright test src/tests/e2e/coherence-v1.spec.ts --project=chromium
          ./node_modules/.bin/playwright test src/tests/e2e/journeys/journey-3-wedge.spec.ts --grep '@real-backend' --project=chromium

      - name: Skip E2E smoke tests when full-stack harness is unavailable
        if: ${{ vars.RUN_FULL_E2E != 'true' || env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' || env.CLERK_SECRET_KEY == '' }}
        run: echo "::notice::E2E smoke skipped — the coherence-v1/journey-3-wedge specs need the seeded backend and Clerk secret key in CI (FRT-192). Set repo variable RUN_FULL_E2E=true to make this gate blocking."

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload E2E backend log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-backend-log
          path: ${{ runner.temp }}/c2pro-e2e-api.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup E2E backend infrastructure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/c2pro-e2e-jwks.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/c2pro-e2e-jwks.pid")" || true
          fi
          docker compose -f docker-compose.test.yml down -v

  # TASK-DEV-018: previously only Vercel ran `next build` at deploy time — a
  # production build break was never caught in CI, only at deploy. Advisory
  # for now; promote to REQUIRED_JOBS once it has run green for a while.
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsubW9jay5sb2NhbCQ' }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup web environment
        uses: ./.github/actions/setup-node-web

      - name: Production build
        working-directory: apps/web
        run: pnpm build

  # ──────────────────────────── Join gate ───────────────────────────────
  # The ONLY check that branch protection should require. Skipped lanes are
  # fine (path filtering); failed or cancelled required lanes are not.

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - detect-changes
      - backend-lint
      - backend-typecheck
      - backend-unit
      - backend-presidio-ner
      - backend-security
      - backend-integration
      - backend-core
      - backend-coherence
      - backend-modules
      - backend-coverage
      - backend-migrations
      - frontend-quality
      - frontend-test
      - frontend-e2e-smoke
      - frontend-build
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all test artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: test-results

      - name: Publish test summary
        continue-on-error: true
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ET

          total_files = 0
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0

          for path in glob.glob("test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              if not suites:
                  continue
              total_files += 1
              for suite in suites:
                  total_tests += int(suite.attrib.get("tests", 0) or 0)
                  total_failures += int(suite.attrib.get("failures", 0) or 0)
                  total_errors += int(suite.attrib.get("errors", 0) or 0)
                  total_skipped += int(suite.attrib.get("skipped", 0) or 0)

          passed = max(total_tests - total_failures - total_errors - total_skipped, 0)
          lines = [
              "## Test Results Summary",
              f"- Parsed reports: {total_files}",
              f"- Total tests: {total_tests}",
              f"- Passed: {passed}",
              f"- Failed: {total_failures}",
              f"- Errors: {total_errors}",
              f"- Skipped: {total_skipped}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Render quality gate report
        continue-on-error: true
        uses: ./.github/actions/quality-report
        with:
          coverage-glob: "test-results/**/coverage.xml"
          junit-glob: "test-results/**/*.xml"
          wireframe-coverage-json: apps/web/wireframe-coverage.json
          output: quality-report.md
          fail-on-contract-drop: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

      - name: Comment quality gate report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: c2pro-quality-report
          path: quality-report.md

      - name: Upload quality gate report
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-quality-report
          path: quality-report.md
          retention-days: 90

      - name: Evaluate required gates
        env:
          RESULT_DETECT: ${{ needs.detect-changes.result }}
          RESULT_BACKEND_LINT: ${{ needs.backend-lint.result }}
          RESULT_BACKEND_UNIT: ${{ needs.backend-unit.result }}
          RESULT_BACKEND_PRESIDIO_NER: ${{ needs.backend-presidio-ner.result }}
          RESULT_BACKEND_SECURITY: ${{ needs.backend-security.result }}
          RESULT_BACKEND_MIGRATIONS: ${{ needs.backend-migrations.result }}
          RESULT_FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          RESULT_FRONTEND_TEST: ${{ needs.frontend-test.result }}
          RESULT_FRONTEND_E2E: ${{ needs.frontend-e2e-smoke.result }}
          RESULT_BACKEND_TYPECHECK: ${{ needs.backend-typecheck.result }}
          RESULT_BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          RESULT_BACKEND_CORE: ${{ needs.backend-core.result }}
          RESULT_BACKEND_COHERENCE: ${{ needs.backend-coherence.result }}
          RESULT_BACKEND_MODULES: ${{ needs.backend-modules.result }}
          RESULT_BACKEND_COVERAGE: ${{ needs.backend-coverage.result }}
          RESULT_FRONTEND_BUILD: ${{ needs.frontend-build.result }}
        run: |
          set -euo pipefail

          # Required jobs: must be success or skipped (skipped = lane not affected
          # by this change). Advisory jobs are reported but never gate.
          REQUIRED_JOBS=(
            "detect-changes:$RESULT_DETECT"
            "backend-lint:$RESULT_BACKEND_LINT"
            "backend-typecheck:$RESULT_BACKEND_TYPECHECK"
            "backend-unit:$RESULT_BACKEND_UNIT"
            "backend-presidio-ner:$RESULT_BACKEND_PRESIDIO_NER"
            "backend-security:$RESULT_BACKEND_SECURITY"
            "backend-integration:$RESULT_BACKEND_INTEGRATION"
            "backend-core:$RESULT_BACKEND_CORE"
            "backend-coherence:$RESULT_BACKEND_COHERENCE"
            "backend-modules:$RESULT_BACKEND_MODULES"
            "backend-coverage:$RESULT_BACKEND_COVERAGE"
            "backend-migrations:$RESULT_BACKEND_MIGRATIONS"
            "frontend-quality:$RESULT_FRONTEND_QUALITY"
            "frontend-test:$RESULT_FRONTEND_TEST"
            "frontend-e2e-smoke:$RESULT_FRONTEND_E2E"
            "frontend-build:$RESULT_FRONTEND_BUILD"
          )
          ADVISORY_JOBS=()

          {
            echo "## CI Gate"
            echo ""
            echo "| Job | Result | Gating |"
            echo "|-----|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for entry in "${REQUIRED_JOBS[@]}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "| $job | $result | required |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Required job '$job' finished with result '$result'."
              FAILED=1
            fi
          done
          for entry in "${ADVISORY_JOBS[@]}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "| $job | $result | advisory |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "✓ All required CI gates passed."
