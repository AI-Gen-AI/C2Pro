name: Secret Scan

# Phase 0 (TASK-V3-P0-02): gate new secrets using the repo's existing .gitleaks.toml.
# Scans the checked-out working tree (no deps installed -> no node_modules), so it does
# NOT fail on secrets already in git history (those require a separate one-time purge +
# credential rotation). New secrets committed to source fail the build.

on:
  pull_request:
  push:
    branches: ["main", "feat/**"]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xzf - gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1
