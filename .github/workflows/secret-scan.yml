name: Secret Scan

# Phase 0 (TASK-V3-P0-02): gate new secrets using the repo's existing .gitleaks.toml.
# Scans the checked-out working tree (no deps installed -> no node_modules), so it does
# NOT fail on secrets already in git history (those require a separate one-time purge +
# credential rotation). New secrets committed to source fail the build.

on:
  pull_request:
  push:
    branches: ["main", "feat/**"]

# Push and pull_request events for the same commit share one concurrency key.
# This preserves early feature-branch secret detection while cancelling an
# overlapping duplicate scan when the same SHA is also validated by a PR.
concurrency:
  group: secret-scan-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xzf - gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1
