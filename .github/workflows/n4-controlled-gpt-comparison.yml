name: N4 Controlled GPT Comparison

on:
  workflow_dispatch:
    inputs:
      confirm_paid_trial:
        description: "Type RUN-ONE-N4-TRIAL to authorize one bounded paid model call"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gpt-actual-contract:
    # No paid call from a push or unapproved commit marker.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_paid_trial == 'RUN-ONE-N4-TRIAL'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/c2pro_test
      JWT_SECRET_KEY: n4-multimodel-trial-only-minimum-32-characters
      C2PRO_N4_PROVIDER: openai
      C2PRO_N4_EXTERNAL_PROVIDER_ENABLED: "1"
      C2PRO_N4_OPENAI_MODEL: gpt-6-sol
      C2PRO_N4_TRIAL_STYLE: concise
      C2PRO_N4_OUTPUT_MAX_TOKENS: "6000"
      C2PRO_N4_MAX_REQUEST_USD: "0.20"
      C2PRO_N4_INPUT_USD_PER_M: "2.0"
      C2PRO_N4_OUTPUT_USD_PER_M: "10.0"
      OPENAI_API_KEY: ${{ secrets.S2_E2E_OPENAI_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/scripts/requirements-n4-locked.txt
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r ../../.github/scripts/requirements-n4-locked.txt
      - name: Offline adapter tests
        working-directory: apps/api
        run: PYTHONPATH=. python -m pytest -q tests/unit/analysis/test_n4_external_providers.py
      - name: One real GPT call
        working-directory: apps/api
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OpenAI API secret missing; no call made" >&2
            exit 1
          fi
          PYTHONPATH=. python scripts/n4_multimodel_trial.py --source tests/fixtures/n4_solarmax_critical_excerpt.txt --receipt /tmp/n4-gpt-real-receipt.json
      - name: Receipt without source or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4-gpt-real-receipt
          path: /tmp/n4-gpt-real-receipt.json
          if-no-files-found: ignore
          retention-days: 7
