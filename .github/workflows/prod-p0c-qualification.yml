name: P0c Production Qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: c2pro-p0c-production-qualification
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PROD_ACCEPTANCE_BASE_URL: "https://c2pro.io"
  PROD_ACCEPTANCE_RAILWAY_PROJECT_ID: "db60e356-d645-4561-a8c5-ddf5e5a2afa2"
  PROD_ACCEPTANCE_RAILWAY_ENVIRONMENT_ID: "ecd39af1-2501-4b9b-8e2e-fafcc6a66570"
  PROD_ACCEPTANCE_RAILWAY_API_SERVICE_ID: "dd372d3a-fb0a-4953-862b-63a10b9058ad"
  PROD_ACCEPTANCE_RAILWAY_WORKER_SERVICE_ID: "e2fac2e9-e9f7-42a8-b022-3c9309d0c763"
  PROD_ACCEPTANCE_RAILWAY_SCHEDULER_SERVICE_ID: "d7952082-b1b3-46f4-b916-c66c8329452c"
  PROD_ACCEPTANCE_VERCEL_TEAM_ID: "team_OD4wmtP2vMrbaA8K5C3WcVET"
  PROD_ACCEPTANCE_VERCEL_PROJECT_ID: "prj_3CgujYjdedPU5ThQFi4JqHmnlwAr"

jobs:
  p0c-production-qualification:
    name: "#686 P0c exact-runtime production qualification"
    if: >-
      github.event.issue.number == 686 &&
      github.event.comment.user.login == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      startsWith(github.event.comment.body, 'RUN-ISSUE-686 ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-qualification

    steps:
      - name: Parse exact bounded owner command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: python
        run: |
          import os
          import re
          import uuid

          body = os.environ["COMMENT_BODY"].strip()
          pattern = re.compile(
              r"^RUN-ISSUE-686 "
              r"backend_sha=(?P<backend_sha>[0-9a-f]{40}) "
              r"backend_deployment=(?P<backend_deployment>[0-9a-fA-F-]{36}) "
              r"frontend_sha=(?P<frontend_sha>[0-9a-f]{40}) "
              r"frontend_deployment=(?P<frontend_deployment>dpl_[A-Za-z0-9]{20,64}) "
              r"project_id=(?P<project_id>[0-9a-fA-F-]{36}) "
              r"document_id=(?P<document_id>[0-9a-fA-F-]{36}) "
              r"source_revision_id=(?P<source_revision_id>[0-9a-fA-F-]{36}) "
              r"(?:recovery_revision_id=(?P<recovery_revision_id>[0-9a-fA-F-]{36}) )?"
              r"staged_clear=(?P<staged_clear>true)$"
          )
          match = pattern.fullmatch(body)
          if not match:
              raise SystemExit("Refusing owner command: exact bounded format required.")

          values = match.groupdict()
          for key in ("backend_deployment", "project_id", "document_id", "source_revision_id", "recovery_revision_id"):
              if not values.get(key):
                  continue
              try:
                  uuid.UUID(values[key])
              except ValueError as exc:
                  raise SystemExit(f"Refusing owner command: malformed {key}.") from exc

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  print(f"{key}={value or ''}", file=output)

      - name: Fail closed on owner intent and bounded inputs
        env:
          CONFIRM: RUN-ISSUE-686
          STAGED_CLEAR: ${{ steps.parse.outputs.staged_clear }}
          BACKEND_SHA: ${{ steps.parse.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.parse.outputs.frontend_sha }}
          BACKEND_DEPLOYMENT: ${{ steps.parse.outputs.backend_deployment }}
          FRONTEND_DEPLOYMENT: ${{ steps.parse.outputs.frontend_deployment }}
          PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          DOCUMENT_ID: ${{ steps.parse.outputs.document_id }}
          SOURCE_REVISION_ID: ${{ steps.parse.outputs.source_revision_id }}
          RECOVERY_REVISION_ID: ${{ steps.parse.outputs.recovery_revision_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RUN-ISSUE-686"
          test "${GITHUB_REF_NAME}" = "main"
          test "$STAGED_CLEAR" = "true"
          [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_DEPLOYMENT" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$FRONTEND_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]{20,64}$ ]]
          for id in "$PROJECT_ID" "$DOCUMENT_ID" "$SOURCE_REVISION_ID"; do
            [[ "$id" =~ ^[0-9a-fA-F-]{36}$ ]]
          done
          if [ -n "${RECOVERY_REVISION_ID:-}" ]; then
            [[ "$RECOVERY_REVISION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
            test "$RECOVERY_REVISION_ID" != "$SOURCE_REVISION_ID"
          fi

      - name: Fail closed on protected qualification prerequisites
        env:
          RAILWAY_TOKEN: ${{ secrets.PROD_ACCEPTANCE_RAILWAY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.PROD_ACCEPTANCE_VERCEL_TOKEN }}
          DB_RO: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          CLERK_ORG: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
          CLERK_EMAIL: ${{ secrets.PROD_ACCEPTANCE_CLERK_EMAIL }}
          CLERK_PASSWORD: ${{ secrets.PROD_ACCEPTANCE_CLERK_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RAILWAY_TOKEN VERCEL_TOKEN DB_RO TENANT_ID CLERK_ORG CLERK_EMAIL CLERK_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected prerequisite: $name" >&2; exit 2; }
          done
          echo "Protected qualification prerequisites present; values withheld."

      - name: Checkout exact control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify control commit belongs to canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -f validation/product/c2pro-master-product-control-v1.yaml
          echo "CONTROL_COMMIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PROD_ACCEPTANCE_RUN_ID=p0c-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Observe production deployment identities from providers
        env:
          PROD_ACCEPTANCE_RAILWAY_API_TOKEN: ${{ secrets.PROD_ACCEPTANCE_RAILWAY_API_TOKEN }}
          PROD_ACCEPTANCE_VERCEL_TOKEN: ${{ secrets.PROD_ACCEPTANCE_VERCEL_TOKEN }}
          PROD_INPUT_FRONTEND_DEPLOYMENT_ID: ${{ steps.parse.outputs.frontend_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/product-qualification/runtime/provider

          railway_graphql() {
            local payload="$1"
            local output="$2"
            local candidate="${output}.candidate"
            local auth_mode header_name header_value
            rm -f "$candidate"
            for auth_mode in bearer project; do
              if [ "$auth_mode" = "bearer" ]; then
                header_name="Authorization"
                header_value="Bearer ${PROD_ACCEPTANCE_RAILWAY_API_TOKEN}"
              else
                header_name="Project-Access-Token"
                header_value="${PROD_ACCEPTANCE_RAILWAY_API_TOKEN}"
              fi
              if curl --fail --silent --show-error \
                --request POST \
                --url "https://backboard.railway.com/graphql/v2" \
                --header "${header_name}: ${header_value}" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                --output "$candidate"; then
                if jq -e '((.errors // []) | length == 0) and (((.data.serviceInstance.latestDeployment.id? // "") | length) > 0)' "$candidate" >/dev/null; then
                  mv "$candidate" "$output"
                  return 0
                fi
              fi
            done
            rm -f "$candidate"
            return 1
          }

          service_query='query serviceInstance($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { latestDeployment { id status meta } } }'
          for pair in \
            "api:${PROD_ACCEPTANCE_RAILWAY_API_SERVICE_ID}" \
            "worker:${PROD_ACCEPTANCE_RAILWAY_WORKER_SERVICE_ID}" \
            "scheduler:${PROD_ACCEPTANCE_RAILWAY_SCHEDULER_SERVICE_ID}"; do
            name="${pair%%:*}"
            service_id="${pair#*:}"
            payload="$(jq -cn \
              --arg q "$service_query" \
              --arg environment "$PROD_ACCEPTANCE_RAILWAY_ENVIRONMENT_ID" \
              --arg service "$service_id" \
              '{query:$q,variables:{serviceId:$service,environmentId:$environment}}')"
            railway_graphql "$payload" "evidence/product-qualification/runtime/provider/railway-${name}.json"
          done

          curl --fail --silent --show-error \
            --url "https://api.vercel.com/v13/deployments/c2pro.io?teamId=${PROD_ACCEPTANCE_VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${PROD_ACCEPTANCE_VERCEL_TOKEN}" \
            --output evidence/product-qualification/runtime/provider/vercel-frontend.json

      - name: Verify exact provider deployment identities
        id: runtime_identity
        env:
          BACKEND_SHA: ${{ steps.parse.outputs.backend_sha }}
          BACKEND_DEPLOYMENT: ${{ steps.parse.outputs.backend_deployment }}
          FRONTEND_SHA: ${{ steps.parse.outputs.frontend_sha }}
          FRONTEND_DEPLOYMENT: ${{ steps.parse.outputs.frontend_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          python validation/product/verify_prod_deployment_identity.py \
            --expected-backend-sha "$BACKEND_SHA" \
            --expected-api-deployment "$BACKEND_DEPLOYMENT" \
            --expected-frontend-sha "$FRONTEND_SHA" \
            --expected-frontend-deployment "$FRONTEND_DEPLOYMENT" \
            --expected-frontend-project "$PROD_ACCEPTANCE_VERCEL_PROJECT_ID"

          backend_sha="$(python -c 'import json; print(json.load(open("evidence/product-qualification/runtime/deployment-identity.json"))["backend"]["api"]["commit_sha"])')"
          frontend_sha="$(python -c 'import json; print(json.load(open("evidence/product-qualification/runtime/deployment-identity.json"))["frontend"]["commit_sha"])')"
          echo "backend_sha=$backend_sha" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=$frontend_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: "3.11"
          install-system-deps: "false"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install production qualification browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build byte-distinct semantic no-change fixture
        shell: bash
        run: |
          set -euo pipefail
          python apps/api/scripts/build_p0c_semantic_no_change_fixture.py
          fixture="apps/web/playwright/.prod-p0c/contract-c-semantic-no-change.pdf"
          test -f "$fixture"
          fixture_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          [[ "$fixture_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "PROD_P0C_NO_CHANGE_EXPECTED_SHA256=$fixture_sha" >> "$GITHUB_ENV"

      - name: Read-only synthetic tenant preflight
        env:
          PROD_ACCEPTANCE_DATABASE_URL_READONLY: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python apps/api/scripts/verify_prod_synthetic_journey.py \
            --tenant-id "$PROD_ACCEPTANCE_EXPECTED_TENANT_ID" \
            --clerk-org-id "$PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID"
          echo "PROD_ACCEPTANCE_TENANT_PREFLIGHT_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Non-mutating real production identity preflight
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: "https://c2pro.io"
          PROD_ACCEPTANCE_CLERK_EMAIL: ${{ secrets.PROD_ACCEPTANCE_CLERK_EMAIL }}
          PROD_ACCEPTANCE_CLERK_PASSWORD: ${{ secrets.PROD_ACCEPTANCE_CLERK_PASSWORD }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
          PROD_ACCEPTANCE_EXPECTED_BACKEND_SHA: ${{ steps.parse.outputs.backend_sha }}
          PROD_ACCEPTANCE_OBSERVED_BACKEND_SHA: ${{ steps.runtime_identity.outputs.backend_sha }}
          PROD_ACCEPTANCE_EXPECTED_FRONTEND_SHA: ${{ steps.parse.outputs.frontend_sha }}
          PROD_ACCEPTANCE_OBSERVED_FRONTEND_SHA: ${{ steps.runtime_identity.outputs.frontend_sha }}
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright test \
            src/tests/e2e/prod-acceptance/706-production-identity-preflight.spec.ts \
            --project=prod-identity-preflight \
            --reporter=line --workers=1

      - name: Fail closed if accepted P0b project is no longer clean
        env:
          PROD_ACCEPTANCE_DATABASE_URL_READONLY: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_P0C_PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          PROD_P0C_DOCUMENT_ID: ${{ steps.parse.outputs.document_id }}
          PROD_P0C_SOURCE_REVISION_ID: ${{ steps.parse.outputs.source_revision_id }}
          PROD_P0C_RECOVERY_REVISION_ID: ${{ steps.parse.outputs.recovery_revision_id }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_args=()
          if [ -n "${PROD_P0C_RECOVERY_REVISION_ID:-}" ]; then
            recovery_args+=(--recovery-revision-id "$PROD_P0C_RECOVERY_REVISION_ID")
          fi
          python apps/api/scripts/verify_p0c_prod_journey.py \
            --project-id "$PROD_P0C_PROJECT_ID" \
            --document-id "$PROD_P0C_DOCUMENT_ID" \
            --source-revision-id "$PROD_P0C_SOURCE_REVISION_ID" \
            "${recovery_args[@]}"

      - name: Execute real P0c production browser journey
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: "https://c2pro.io"
          PROD_ACCEPTANCE_CLERK_EMAIL: ${{ secrets.PROD_ACCEPTANCE_CLERK_EMAIL }}
          PROD_ACCEPTANCE_CLERK_PASSWORD: ${{ secrets.PROD_ACCEPTANCE_CLERK_PASSWORD }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID: ${{ secrets.PROD_ACCEPTANCE_CLERK_ORGANIZATION_ID }}
          PROD_ACCEPTANCE_EXPECTED_BACKEND_SHA: ${{ steps.parse.outputs.backend_sha }}
          PROD_ACCEPTANCE_OBSERVED_BACKEND_SHA: ${{ steps.runtime_identity.outputs.backend_sha }}
          PROD_ACCEPTANCE_EXPECTED_FRONTEND_SHA: ${{ steps.parse.outputs.frontend_sha }}
          PROD_ACCEPTANCE_OBSERVED_FRONTEND_SHA: ${{ steps.runtime_identity.outputs.frontend_sha }}
          PROD_P0C_PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          PROD_P0C_DOCUMENT_ID: ${{ steps.parse.outputs.document_id }}
          PROD_P0C_SOURCE_REVISION_ID: ${{ steps.parse.outputs.source_revision_id }}
          PROD_P0C_RECOVERY_REVISION_ID: ${{ steps.parse.outputs.recovery_revision_id }}
          PROD_P0C_NO_CHANGE_PDF: ${{ github.workspace }}/apps/web/playwright/.prod-p0c/contract-c-semantic-no-change.pdf
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright test \
            src/tests/e2e/prod-acceptance/686-p0c-production.spec.ts \
            --project=prod-p0c-acceptance \
            --reporter=line --workers=1

      - name: Resolve target revision from bounded browser evidence
        shell: bash
        run: |
          set -euo pipefail
          target="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('apps/web/playwright/.prod-p0c/run.json').read_text())
          value=data.get('target_revision_id')
          if not isinstance(value,str) or not value:
              raise SystemExit(2)
          print(value)
          PY
          )"
          no_change_target="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('apps/web/playwright/.prod-p0c/run.json').read_text())
          value=data.get('no_change_target_revision_id')
          if not isinstance(value,str) or not value:
              raise SystemExit(2)
          print(value)
          PY
          )"
          echo "PROD_P0C_TARGET_REVISION_ID=$target" >> "$GITHUB_ENV"
          echo "PROD_P0C_NO_CHANGE_TARGET_REVISION_ID=$no_change_target" >> "$GITHUB_ENV"

      - name: Read-only durable post-run P0c verification
        env:
          PROD_ACCEPTANCE_DATABASE_URL_READONLY: ${{ secrets.PROD_ACCEPTANCE_DATABASE_URL_READONLY }}
          PROD_ACCEPTANCE_EXPECTED_TENANT_ID: ${{ secrets.PROD_ACCEPTANCE_EXPECTED_TENANT_ID }}
          PROD_P0C_PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          PROD_P0C_DOCUMENT_ID: ${{ steps.parse.outputs.document_id }}
          PROD_P0C_SOURCE_REVISION_ID: ${{ steps.parse.outputs.source_revision_id }}
          PROD_P0C_RECOVERY_REVISION_ID: ${{ steps.parse.outputs.recovery_revision_id }}
        shell: bash
        run: |
          set -euo pipefail
          python apps/api/scripts/verify_p0c_prod_journey.py \
            --project-id "$PROD_P0C_PROJECT_ID" \
            --document-id "$PROD_P0C_DOCUMENT_ID" \
            --source-revision-id "$PROD_P0C_SOURCE_REVISION_ID" \
            --target-revision-id "$PROD_P0C_TARGET_REVISION_ID" \
            --no-change-target-revision-id "$PROD_P0C_NO_CHANGE_TARGET_REVISION_ID" \
            --no-change-expected-blob-hash "$PROD_P0C_NO_CHANGE_EXPECTED_SHA256" \
            --write-evidence

      - name: Build non-authoritative P0c evidence bundle
        env:
          BACKEND_SHA: ${{ steps.parse.outputs.backend_sha }}
          BACKEND_DEPLOYMENT: ${{ steps.parse.outputs.backend_deployment }}
          FRONTEND_SHA: ${{ steps.parse.outputs.frontend_sha }}
          FRONTEND_DEPLOYMENT: ${{ steps.parse.outputs.frontend_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          python validation/product/build_p0c_prod_qualification_bundle.py \
            --control-commit-sha "$CONTROL_COMMIT_SHA" \
            --backend-commit-sha "$BACKEND_SHA" \
            --backend-deployment-id "$BACKEND_DEPLOYMENT" \
            --frontend-commit-sha "$FRONTEND_SHA" \
            --frontend-deployment-id "$FRONTEND_DEPLOYMENT" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Validate canonical qualification evidence contract
        run: python validation/product/validate_qualification_evidence.py

      - name: Emit bounded summary
        if: always()
        env:
          BACKEND_SHA: ${{ steps.parse.outputs.backend_sha }}
          BACKEND_DEPLOYMENT: ${{ steps.parse.outputs.backend_deployment }}
          FRONTEND_SHA: ${{ steps.parse.outputs.frontend_sha }}
          FRONTEND_DEPLOYMENT: ${{ steps.parse.outputs.frontend_deployment }}
          PROD_P0C_PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          PROD_P0C_DOCUMENT_ID: ${{ steps.parse.outputs.document_id }}
          PROD_P0C_SOURCE_REVISION_ID: ${{ steps.parse.outputs.source_revision_id }}
        shell: bash
        run: |
          {
            echo "## C2Pro #686 P0c production qualification"
            echo
            echo "- control commit: `$GITHUB_SHA`"
            echo "- backend: `$BACKEND_DEPLOYMENT` / `$BACKEND_SHA`"
            echo "- frontend: `$FRONTEND_DEPLOYMENT` / `$FRONTEND_SHA`"
            echo "- accepted project: `$PROD_P0C_PROJECT_ID`"
            echo "- accepted document: `$PROD_P0C_DOCUMENT_ID`"
            echo "- source revision A: `$PROD_P0C_SOURCE_REVISION_ID`"
            if [ -n "${PROD_P0C_RECOVERY_REVISION_ID:-}" ]; then
              echo "- recovery revision B: `$PROD_P0C_RECOVERY_REVISION_ID`"
              echo "- recovery mode: **canonical UI retry**"
            fi
            echo "- lifecycle authority: **false**"
            echo
            echo "Credentials and tokens are never included in this summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded P0c qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 3
          name: c2pro-686-p0c-production-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            apps/web/playwright/.prod-p0c/run.json
            apps/web/playwright/.prod-p0c/contract-c-semantic-no-change.pdf
            apps/web/playwright/.prod-p0c/pj01/**
            evidence/product-qualification/runtime/deployment-identity.json
            evidence/product-qualification/runtime/p0c-verifier.json
            evidence/product-qualification/p0c-prod-gh-*.yaml
