# Dependabot: keeps GitHub Actions pins, backend pip deps, and the pnpm
# workspace fresh. Minor/patch updates are grouped into one weekly PR per
# ecosystem to keep noise down; majors arrive as individual PRs.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "structlog"
        # 26+ breaks the current add_logger_name + PrintLoggerFactory config at
        # runtime; lifted once the logging config is adapted (TASK-DEV-036).
        # pip ignore conditions require PEP 440 specifiers ("26.x" is invalid).
        versions: [">=26.0.0"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      js-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
