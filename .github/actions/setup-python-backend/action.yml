name: Setup Python backend
description: >-
  Python toolchain, system packages, and cached pip install for apps/api.
  Every backend CI job starts here so toolchain changes happen in one place.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  install-system-deps:
    description: Install apt packages required by the backend test suite (libmagic).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: apps/api/requirements.txt

    - name: Install system dependencies
      if: inputs.install-system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libmagic1

    - name: Install Python dependencies
      shell: bash
      working-directory: apps/api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-magic
