name: Setup Python backend
description: >-
  Python toolchain, system packages, and cached pip install for apps/api.
  Every backend CI job starts here so toolchain changes happen in one place.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  install-system-deps:
    description: Install apt packages required by the backend test suite (libmagic).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: apps/api/requirements.txt

    - name: Install system dependencies
      if: inputs.install-system-deps == 'true'
      shell: bash
      run: |
        if dpkg-query -W -f='${Status}' libmagic1 2>/dev/null | grep -q "ok installed"; then
          echo "libmagic1 is already installed. Skipping APT update and installation."
        else
          echo "libmagic1 is not installed. Preparing installation..."
          for f in /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources; do
            if [ -f "$f" ]; then
              echo "Disabling Chrome source: $f"
              sudo mv "$f" "${f}.disabled"
            fi
          done
          echo "Updating package lists with retries..."
          sudo apt-get update -qq -o Acquire::Retries=3
          echo "Installing libmagic1..."
          sudo apt-get install -y -qq libmagic1
        fi

    - name: Install Python dependencies
      shell: bash
      working-directory: apps/api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-magic==0.4.27
