id: ejecutar_pytest
version: 1.0.0
description: "Ejecuta pytest y devuelve resultados estructurados"
author: "C2Pro Team"
input:
  target: "string (required) - Ruta de archivo o directorio de tests"
  verbose: "boolean (optional, default: true)"
output:
  passed: "integer"
  failed: "integer"
  errors: "array de objetos con test_name, error_message, file, line"
dependencies:
  - "pytest"
  - "pytest-asyncio"
timeout_ms: 120000
sandbox: true
