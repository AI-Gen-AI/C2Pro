# ── P0b vertical contract (define ALL slices + exit gates BEFORE slice 1) ──────
p0b_vertical_contract:
  invariant_ids: [INV-1, INV-UX, INV-COH]     # <-- parity-compared
  done_definition: >
    Production evidence: upload ONE document -> six-category decomposition ->
    per-category {state, findings, missing_data} -> actionable gap alerts ->
    Health Vector -> persisted + read via API -> user-visible UI/report.
    Unknown => null (never fabricated zero/green). Contract/Documentation produce
    evidence-backed values when the source supports them; unsupported dimensions
    explain exactly what is missing. Coherence unavailable as a headline until >=2 docs.
  invariants:
    - "INV-1 honest-null: no category PRESENT/green without supporting evidence"
    - "INV-UX (I): backend null -> UI renders 'Unknown / Insufficient evidence' and NEVER 0%; 0 is valid ONLY when an evidence-backed scorer genuinely returns zero"
    - "INV-COH: coherence_subscore stays NULL while <2 reconcilable documents exist; relational Coherence is never a single-doc headline"
    - "Reuse CoherenceCategory (SCOPE/BUDGET/TIME/TECHNICAL/LEGAL/QUALITY) + HealthNullReason.INSUFFICIENT_EVIDENCE"
  slices:
    - {id: P0b-L4-1, name: "category_coverage domain (pure)", scope: "compute_category_coverage() + gap_alerts(); PRESENT|INSUFFICIENT_EVIDENCE; per-category action map", files_new: ["apps/api/src/health/domain/category_coverage.py", "apps/api/tests/unit/health/test_category_coverage.py"], exit_gate: "RED->GREEN unit: covered=PRESENT; absent=INSUFFICIENT_EVIDENCE + correct gap alert; all-present=0 gaps; empty=6 gaps; INV-1; ruff+mypy-ratchet green", slice_status: DONE}
    - {id: P0b-L4-2, name: "wire single-doc intake -> classification -> coverage", scope: "one document's classified clauses -> per-category {state, findings(ADR-022 + intrinsic), missing_data}; CROSS findings preserved separately (never attributed to a canonical category); CategoryAssessment invariants enforced", exit_gate: "integration: real doc -> coverage object with findings + missing_data; contract-only => TECHNICAL/BUDGET/TIME insufficient", slice_status: DONE}
    - {id: P0b-L4-3, name: "persist the single-document assessment from the real analysis into the Health Vector", scope: "N8 (coherence_scorer) computes SingleDocumentCoverage ONCE from canonical Clause[] + FindingSignal[] - the earliest point where both coexist, strictly before N17. The versioned artifact is stored in analyses.result_json; graph.completed carries analysis_id LINEAGE ONLY; SnapshotWriter resolves that lineage and persists HealthVector.single_document_coverage as a NON-ROLLUP product/evidence surface (ADR-022 contract_clarity_findings precedent). NO new Contract/Documentation numeric formula - the existing dimension scorers and composite behaviour are untouched. coherence_subscore stays NULL. Honest-null lineage precedence enforced: a GRAPH_COMPLETED analysis is authoritative (valid assessment else None, never a stale carry-forward); only a no-new-analysis trigger carries the last valid assessment forward.", exit_gate: "assessment persisted + read back without re-running CategoryRouter; six assessments + missing_data + gaps + CROSS survive round-trip; legacy/unknown-version/malformed lineage => None (never empty-known); coherence_subscore=NULL; composite scoring unchanged; replay idempotent", slice_status: DONE}
    - {id: P0b-L4-4, name: "read API", scope: "GET project health returns per-category decomposition + gap alerts + Health Vector. PARTIAL: GET /api/v1/projects/{project_id}/health already returns HealthVector, so single_document_coverage is ALREADY exposed through the existing response contract (and the generated OpenAPI); dedicated API acceptance + consumer validation remain pending.", exit_gate: "authenticated GET returns decomposition+gaps+vector; Unknown=null in payload (never 0)", slice_status: PARTIAL}
    - {id: P0b-L4-5, name: "user-visible UI/report", scope: "per-category view + gap alerts on document/health surface; null renders 'Unknown / Insufficient evidence'", exit_gate: "PROD: upload one doc -> UI shows per-category state/findings/missing_data + actionable gap alerts + Health Vector; Unknown!=0%; Coherence absent until >=2 docs", slice_status: BLOCKED}
  residuals:
    - id: P0b-R1-EVIDENCE-GRANULARITY
      name: "per-clause evidence granularity"
      status: PLANNED
      priority: P0
      blocks: P0b-L4-5
      production_truth: >
        _build_coherence_clauses() currently emits ONE whole-document canonical Clause, so
        evidence is document-level/coarse, per-category evidence_count is effectively 0/1, and
        real CROSS generation cannot occur (_build_category_cross_pairs returns [] for a single
        clause) even though the CROSS transport is implemented correctly and tested.
      required_resolution: >
        Audit and REUSE the existing clause/section extraction and persistence; adapt the
        existing evidence into multiple stable coherence.models.Clause records; preserve stable
        evidence IDs / lineage. No parallel parser, no second segmentation pipeline.
      must_close_before: "P0b-L4-5 / user-facing product validation"
  p0b_exit_gate: "P0b-L4-5 PROD_VALIDATED with the done_definition evidence."

