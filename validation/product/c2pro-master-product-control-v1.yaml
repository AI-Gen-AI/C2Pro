    realization_status: "PARTIAL (Plan/WBS/BoM exist-gated; RfQ/BoQ/comms MISSING)"
    exit_gate: "EPIC-PROC2 5 tasks delivered; build-gate (>=1 CM Change-Impact weekly) lifted"
