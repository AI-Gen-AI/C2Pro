# ══════════════════════════════════════════════════════════════════════════════
# CONTROL INTEGRITY (J)
#   This YAML is the MACHINE source of truth. The Markdown companion
#   (docs/product/00-c2pro-master-product-control-v1.md) is a HUMAN projection of
#   it and MUST NOT diverge on the fields listed in `parity.critical_fields`.
#   A deterministic checker (validation/product/check_control_parity.py) asserts
#   the MD contains every critical value below; CI/pre-merge can run it so the two
#   controls cannot silently drift. Edit YAML first, then reflect into the MD.
# ══════════════════════════════════════════════════════════════════════════════
parity:
  human_projection: docs/product/00-c2pro-master-product-control-v1.md
  checker: validation/product/check_control_parity.py
  critical_fields:
    - production_position.repository_main_sha
    - production_position.deployed_runtime_sha
    - production_position.reliability_operability_baseline
    - production_position.product_value_delivered
    - north_star.full_product
    - north_star.current_product_wedge
    - "adr_realization[*].{adr,realization_status,deployment_status,prod_validation_status}"
    - legacy_coverage.unmapped_open_legacy_items

# ── Plane separation ──────────────────────────────────────────────────────────
# This file records WHAT the product is and how far each capability is REALIZED
# (PRODUCT plane). It does NOT grant execution authority. HOW work is executed
# remains governed by the development-execution plane (.c2pro/). Not a competing plane.
development_execution_authority:
  plane: .c2pro/
  canonical_dev_plan: docs/architecture/development/c2pro-dev-01-minimal-yaml-control-v1.md
  gates: {direct_main_mutation: false, production_runtime: false, merge: human_merge}
  note: >
    Product realization advances only through .c2pro work-envelopes + review-policy
    (human merge, no direct main/prod mutation). This product plane is the target/state
    ledger those envelopes are measured against.

# ── Production position (J): three SEPARATE facts — never infer one from another ─
production_position:
  repository_main_sha: 9c48f4f94d0a5719561916b956f8a78b2129a250   # git: main tip after #570 merge
  deployed_runtime_sha: UNVERIFIED    # DO NOT infer from main. Confirm via Railway deploy log
                                      # (service c2pro-api / production). Expected == main tip ONLY
                                      # if Railway rebuilt after the #570 merge — not assumed here.
  observed_production_evidence:       # what was actually seen live (read-only), independent of any SHA
    - "kuwait2 doc c510de21: enqueue → worker → SUCCESS on dedicated Railway Redis (P0-OPS CLOSED)"
    - "coherence_results: 15/15 rows score_version='coherence-v1' (2026-08-07 .. 2026-08-16); ZERO v2"
    - "coherence_v2_shadow: 1 row, last 2026-08-07 — v2 shadow inert despite 6 tenants flag-enabled"
    - "alerts.severity = public.alertseverity enum (schema conformance #567 applied+validated)"
    - "circuit_breaker_registered service=anthropic_llm (ADR-004) in prod logs"
  reliability_operability_baseline: CLOSED   # P0a — onboarding + async + schema
  product_value_delivered: false             # honest: reliability != product value
  NOT_delivered_to_user:
    - "Per-category (6) Health decomposition from ONE document"
    - "Per-category {state, findings, missing_data}"
    - "Actionable gap alerts ('upload the cronograma / pliego técnico / BoQ')"
    - "User-visible Health Vector / score / findings / time / reporting"

# ── North Star (B): the FULL product, then the current wedge ──────────────────
north_star:
  full_product: >
    C2Pro is CONTINUOUS, EVIDENCE-BACKED PROJECT & PROCUREMENT INTELLIGENCE for
    construction/infrastructure contracts: Health + relational Coherence + Change/Time
    intelligence + Risk + Alerts/Actions/HITL + Project Controls (schedule/cost/
    deliverables/WBS/BOM) + Procurement workflows (RfQ/BoQ/RACI/comms) + Executive
    intelligence (PMO reporting / Morning Briefing / portfolio). Every surface is
    evidence-backed and honest: Unknown renders null — never a fabricated zero/green
    (INV-1, ADR-018). Coherence is one RELATIONAL input (Contract subscore), available
    only with >=2 reconcilable documents — never the whole product, never a single-doc headline.
  current_product_wedge: >
    P0b — Single-document Health activation (ADR-024 -> ADR-018): value from document #1
    (per-category coverage + intrinsic findings + missing_data + gap alerts + Health Vector).
    The wedge is the entry point to the full North Star above, NOT its definition.

# ── Realization vocabulary (design status != realization) ─────────────────────
status_vocabulary:
  DESIGNED:        "ADR/spec accepted; no production code path"
  SCAFFOLDED:      "code/module exists; not wired end-to-end"
  WIRED:           "wired in the running app; not production-validated for user value"
  DEPLOYED:        "running in production"
  PROD_VALIDATED:  "production evidence of the user-visible value it exists to deliver"
  DEFERRED:        "intentionally sequenced later / build-gated"
  BLOCKED:         "blocked on a dependency or gate"
  NONE:            "not applicable / nothing in production"
  PARTIAL:         "some but not all of the field's criterion is met"

# ── Stale claims corrected (E): history preserved; CURRENT state corrected ────
corrected_current_claims:
  - claim: "Phase 1 COMPLETE / product functional for end users"
    where: "CANONICAL C2PRO_MASTER_BACKLOG.md lines 11-13 (main) — NOT only worktrees/archive"
    truth: "P0a reliability/operability baseline CLOSED; product value (Health/findings/alerts/reporting) NOT delivered. Legacy master now carries a COLD-REFERENCE banner (E) pointing here."
  - claim: "All 18 ADRs ratified / zero unimplemented decisions"
    where: "CANONICAL C2PRO_MASTER_BACKLOG.md lines 15-17 (main)"
    truth: "ADRs are ACCEPTED as design, not realized (see adr_realization). The '18-ADR audit' predates ADR-023/024 (added 2026-08-22) and conflates 3 ADR namespaces (see adr_namespaces). Primary-surface ADR-018 is WIRED-not-validated; ADR-024 DESIGNED."
  - claim: "No open code work required for end users"
    where: "Phase 1 Completion Certificate framing (main)"
    truth: "Single-document activation (ADR-024 -> ADR-018) IS the open code work; P0b is a vertical product epic, not done. Plus Coherence v2 cutover, Change-Impact wedge, Alerts/HITL, Procurement, Reporting."

