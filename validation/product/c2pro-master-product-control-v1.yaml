# ── Coherence runtime reconciliation (G + fix 3): observed HISTORY vs routing CAPABILITY ─
coherence_runtime_reconciliation:
  status: COMPLETE                              # bounded READ-ONLY prod reconciliation 2026-08-27
  method: "SELECT-only on prod (tcxedmnvebazcsaridge): coherence_results, coherence_v2_shadow, tenants.settings.feature_flags; + code path apps/api/src/coherence/router.py evaluate_project_coherence"
  global_authoritative_cutover: "NO"            # <-- parity-compared canonical field (quoted: YAML 1.1 coerces bare NO->false)
  observed_persisted_history: "15/15 V1"        # coherence_results, 2026-08-07 .. 2026-08-16
  observed_v2_persisted_headlines: 0
  canonical_canary: ENABLED_FOR_1_TENANT        # ADR-017 scorer-substitution: a ROUTING capability
  v2_enabled_tenants: 6                          # coherence_v2_enabled flag (shadow path)
  v2_orchestrator_shadow: INERT_IN_OBSERVED_DATA  # coherence_v2_shadow = 1 historical row (2026-08-07)
  legacy_global_v2_authoritative_claim: "NOT SUPPORTED BY CURRENT PROD EVIDENCE"
  distinction: >
    Observed persisted HISTORY (15/15 v1) is separate from routing CAPABILITY. The current code
    has a canonical-canary path (ADR-017) with 1 tenant enrolled that CAN substitute the in-response
    headline, and a v2 shadow path (6 tenants flag-enabled) that is inert in observed data. Do NOT
    claim v1 is the only scorer that can persist a headline; claim only that global authoritative v2
    cutover has NOT been demonstrated and the legacy 'v2 authoritative' narrative is unsupported.
  evidence:
    persisted_score_version: "coherence_results 15/15 = 'coherence-v1' (first 2026-08-07, last 2026-08-16)"
    v2_shadow_table: "coherence_v2_shadow: 1 row, last 2026-08-07"
    tenant_flag_enrollment: "of 26 tenants: coherence_v2_enabled=6, coherence_canonical_canary=1, coherence_llm_crosscheck=1"
    global_shadow_setting: "COHERENCE_V2_SHADOW_MODE default True (config.py:389); shadow guard needs per-tenant v2 flag AND global setting (router.py:848-851)"
    projectgraph_flag: "is_project_graph_enabled(tenant) per-tenant, default off (ADR-017 flag-gated OFF)"
    scorer_path: "router.py:741 evaluate_coherence_async (v1); canonical-canary (763) + v2 shadow (841) default OFF per tenant"

# ── Capability planes (8; minimum set) ────────────────────────────────────────
capability_planes:
  - {id: ACT-HEALTH,          name: "Activation / Health (single-document)", adrs: [ADR-018, ADR-024, ADR-022]}
  - {id: COHERENCE-XDOC,      name: "Relational Coherence / cross-document",  adrs: [ADR-009, ADR-017, ADR-023]}
  - {id: TEMPORAL-CHANGE,     name: "Temporal / Change-Impact",               adrs: [ADR-015, ADR-016]}
  - {id: ALERTS-ACTIONS-HITL, name: "Alerts / Actions / HITL",               adrs: [ADR-019, ADR-020]}
  - {id: PROJECT-CONTROLS,    name: "Schedule / Cost / Deliverables / WBS / BOM", adrs: [ADR-018]}
  - {id: PROCUREMENT,         name: "Procurement workflows (RfQ/BoQ/RACI/comms)", adrs: []}
  - {id: EXEC-REPORTING,      name: "Executive / Reporting / Briefing",       adrs: [ADR-021]}
  - {id: OPS-TRUST,           name: "Ops / Trust (RLS, PII, resilience, infra)", adrs: [ADR-004]}

# ── Product WBS (C + fix 2): L2 epic per plane; realization_status = single enum ─
product_wbs:
  - id: PWBS-ACT-HEALTH
    plane: ACT-HEALTH
    level: L2
    name: "P0b — Single-document Health activation (VERTICAL epic; decomposed to L4)"
    priority: P0b
    deps: []
    adrs: [ADR-024, ADR-018, ADR-022]
    user_value: "Value from document #1: per-category coverage + intrinsic findings + missing_data + gap alerts + Health Vector"
    realization_status: PARTIAL
    work_status: ACTIVE
    exit_gate: "P0b-L4-5 PROD_VALIDATED (see p0b_vertical_contract.done_definition)"
    evidence_for_done: "upload one doc in prod -> UI shows per-category {state,findings,missing_data} + gap alerts + Health Vector; Unknown=Insufficient-evidence, never 0%"
    children: [P0b-L4-1, P0b-L4-2, P0b-L4-3, P0b-L4-4, P0b-L4-5]
  - id: PWBS-COHERENCE-XDOC
    plane: COHERENCE-XDOC
    level: L2
    name: "Relational Coherence cutover + cross-document (>=2 docs)"
    priority: P1
    deps: [PWBS-ACT-HEALTH]
    adrs: [ADR-009, ADR-017, ADR-023]
    user_value: "Contract-schedule-budget agreement; cross-doc contradiction findings feeding the Contract subscore"
    realization_status: PARTIAL
    work_status: PLANNED
    subtracks: {v1: DEPLOYED, v2: SHADOW_INERT}
    exit_gate: "v2 authoritative cutover behind MAE guard + canary, or explicit decision to keep v1; ProjectGraph Tier-2 enabled; cross-doc contradiction recall validated"
    evidence_for_done: "prod evaluations persist v2 (or v1-by-decision) with cross-doc findings on a >=2-doc project; MAE guard green"
  - id: PWBS-TEMPORAL-CHANGE
    plane: TEMPORAL-CHANGE
    level: L2
    name: "Temporal snapshots + Semantic-diff Change-Impact (the wedge)"
    priority: P1
    deps: [PWBS-ACT-HEALTH]
    adrs: [ADR-015, ADR-016]
    user_value: "Revision lineage, trends, and an evidence-gated Change-Impact Report when a document changes"
    realization_status: SCAFFOLDED
    work_status: PLANNED
    exit_gate: "periodic snapshot capture running (fix Celery Beat, P1-OPS); L3 change-impact wired; Change-Impact Report rendered"
    evidence_for_done: "prod: a document revision produces a persisted snapshot + a Change-Impact Report a user can read"
  - id: PWBS-ALERTS-ACTIONS-HITL
    plane: ALERTS-ACTIONS-HITL
    level: L2
    name: "Alert correlation + Action lifecycle + HITL review loop"
    priority: P2
    deps: [PWBS-TEMPORAL-CHANGE, PWBS-ACT-HEALTH]
    adrs: [ADR-019, ADR-020]
    user_value: "Correlated action items + Contract-Manager approval gates + active-learning loop"
    realization_status: SCAFFOLDED
    work_status: DEFERRED
    exit_gate: "ADR-019/020 build-gate lifted (>=1 CM uses Change-Impact loop weekly); action queue + HITL in the live flow"
    evidence_for_done: "prod: correlated ActionItem enters a CM HITL queue and is approved/rejected with audit trail"
  - id: PWBS-PROJECT-CONTROLS
    plane: PROJECT-CONTROLS
    level: L2
    name: "Health-v1 project controls (Schedule / Cost / Deliverables / WBS / BOM)"
    priority: P2
    deps: [PWBS-ACT-HEALTH]
    adrs: [ADR-018]
    user_value: "Schedule/cost/deliverable health dimensions beyond activation coverage"
    realization_status: PARTIAL
    work_status: PLANNED
    note: "WBS/BOM parse exist"
    exit_gate: "Health v1 dimensions surfaced with honest nulls on the project surface"
    evidence_for_done: "prod: project controls dimensions render evidence-backed or honest-null"
  - id: PWBS-PROCUREMENT
    plane: PROCUREMENT
    level: L2
    name: "Procurement suite (RfQ / BoQ / RACI / stakeholder comms) — EPIC-PROC2"
    priority: P2
    deps: [PWBS-PROJECT-CONTROLS]
    adrs: []
