  - claim: "Project Controls can be represented as multiple discipline WBSs"
    truth: "Rejected. One project has one canonical hierarchical WBS; disciplines are branches/levels."
  - claim: "Coherence Score, Health and Alerts are interchangeable project-health concepts"
