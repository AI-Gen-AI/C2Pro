schema: c2pro-product-control-v1
schema_version: 4
repository: AI-Gen-AI/C2Pro
generated: "2026-08-29"
control_status: reconciliation   # read-only programme snapshot; grants NO execution authority

# ══════════════════════════════════════════════════════════════════════════════
# CONTROL INTEGRITY (J + review fix 1/2)
#   This YAML is the MACHINE source of truth. The Markdown companion
#   (docs/product/00-c2pro-master-product-control-v1.md) carries an explicitly
#   delimited CANONICAL-CONTROL block that is GENERATED from this YAML
#   (validation/product/check_control_parity.py --emit). The checker PARSES this
#   YAML, validates every ADR/WBS row against the per-field status enums, extracts
#   the exact critical values, and compares them value-by-value to the MD block.
#   A contradictory MD value FAILS the check. Edit YAML first, then re-emit the block.
# ══════════════════════════════════════════════════════════════════════════════
parity:
  human_projection: docs/product/00-c2pro-master-product-control-v1.md
  checker: validation/product/check_control_parity.py
  md_block_markers: ["<!-- CANONICAL-CONTROL:START", "<!-- CANONICAL-CONTROL:END"]
  compared_exactly:
    - production_position.reconciled_against_main_sha
    - production_position.deployed_runtime_sha
    - production_position.reliability_operability_baseline
    - production_position.product_value_delivered
    - north_star.current_product_wedge_id
    - coherence_runtime_reconciliation.global_authoritative_cutover
    - legacy_coverage.unmapped_open_legacy_items
    - "product_wbs[*].id + realization_status + work_status (all 8)"
    - "adr(ADR-018,ADR-024).{realization_status,deployment_status,prod_validation_status}"
    - p0b_vertical_contract.done_definition (sha256-16 digest)
    - p0b_vertical_contract.invariant_ids

# ── Per-field status enums (fix 2): every ADR/WBS status MUST be one of these ──
# No free-form compound machine-state values. v1/v2 are structural subtracks, not
# a compound string. The human Markdown may summarize; this YAML stays deterministic.
status_enums:
  design_status:          [Accepted, Proposed, Implemented, Deferred]
  realization_status:     [DESIGNED, SCAFFOLDED, WIRED, DEPLOYED, PARTIAL]
  deployment_status:      [NONE, PARTIAL, DEPLOYED, BLOCKED, SHADOW_INERT]
  prod_validation_status: [NONE, PARTIAL, NOT_VALIDATED, PROD_VALIDATED]
  work_status:            [ACTIVE, PLANNED, DEFERRED, BLOCKED, CLOSED, WONT_DO]   # work lifecycle, INDEPENDENT of realization (DEPLOYED != CLOSED)
  slice_status:           [NOT_STARTED, ACTIVE, PARTIAL, DONE, BLOCKED, DEFERRED] # L4 implementation-slice lifecycle. DONE = the slice met its code/merge exit gate; it does NOT mean the vertical is PROD_VALIDATED (that stays the WBS exit gate).
  residual_status:        [PLANNED, ACTIVE, BLOCKED, DEFERRED, RESOLVED]          # residual lifecycle (a residual is registered work, not an implementation slice, so PLANNED is its entry state).

# ── Plane separation ──────────────────────────────────────────────────────────
development_execution_authority:
  plane: .c2pro/
  canonical_dev_plan: docs/architecture/development/c2pro-dev-01-minimal-yaml-control-v1.md
  gates: {direct_main_mutation: false, production_runtime: false, merge: human_merge}
  note: >
    Product realization advances only through .c2pro work-envelopes + review-policy
    (human merge, no direct main/prod mutation). This product plane is the target/state
    ledger those envelopes are measured against.

# ── Production position (J): three SEPARATE facts — never infer one from another ─
production_position:
  reconciled_against_main_sha: 85caa0ccd0739127b279c93a9c6e979f0e340d21   # repo state THIS reconciliation was performed against (baseline: main after #576 P0b-L4-3 and #577); NOT a claim of continuously-current main — current main SHA is Git-derived runtime info, not canonical programme state, and drifts on every merge
  deployed_runtime_sha: UNVERIFIED    # DO NOT infer from main. Confirm via Railway deploy log
                                      # (service c2pro-api / production). Expected == main tip ONLY
                                      # if Railway rebuilt after the #570 merge — not assumed here.
  observed_production_evidence:
    - "kuwait2 doc c510de21: enqueue → worker → SUCCESS on dedicated Railway Redis (P0-OPS CLOSED)"
    - "coherence_results: 15/15 rows score_version='coherence-v1' (2026-08-07 .. 2026-08-16); ZERO v2"
    - "coherence_v2_shadow: 1 row, last 2026-08-07 — v2 orchestrator shadow inert in observed data"
    - "alerts.severity = public.alertseverity enum (schema conformance #567 applied+validated)"
    - "circuit_breaker_registered service=anthropic_llm (ADR-004) in prod logs"
  reliability_operability_baseline: CLOSED   # P0a — onboarding + async + schema
  product_value_delivered: false             # honest: reliability != product value
  NOT_delivered_to_user:
    - "Per-category (6) Health decomposition from ONE document"
    - "Per-category {state, findings, missing_data}"
    - "Actionable gap alerts ('upload the cronograma / pliego técnico / BoQ')"
    - "User-visible Health Vector / score / findings / time / reporting"

# ── North Star (B): the FULL product, then the current wedge ──────────────────
north_star:
  full_product: >
    C2Pro is CONTINUOUS, EVIDENCE-BACKED PROJECT & PROCUREMENT INTELLIGENCE for
    construction/infrastructure contracts: Health + relational Coherence + Change/Time
    intelligence + Risk + Alerts/Actions/HITL + Project Controls (schedule/cost/
    deliverables/WBS/BOM) + Procurement workflows (RfQ/BoQ/RACI/comms) + Executive
    intelligence (PMO reporting / Morning Briefing / portfolio). Every surface is
    evidence-backed and honest: Unknown renders null — never a fabricated zero/green
    (INV-1, ADR-018). Coherence is one RELATIONAL input (Contract subscore), available
    only with >=2 reconcilable documents — never the whole product, never a single-doc headline.
  current_product_wedge_id: P0b-single-document-health-activation   # stable id for parity compare
  current_product_wedge: >
    P0b — Single-document Health activation (ADR-024 -> ADR-018): value from document #1
    (per-category coverage + intrinsic findings + missing_data + gap alerts + Health Vector).
    The wedge is the entry point to the full North Star above, NOT its definition.

# ── Realization vocabulary (design status != realization) ─────────────────────
status_vocabulary:
  DESIGNED:        "ADR/spec accepted; no production code path"
  SCAFFOLDED:      "code/module exists; not wired end-to-end"
  WIRED:           "wired in the running app; not production-validated for user value"
  DEPLOYED:        "running in production"
  PROD_VALIDATED:  "production evidence of the user-visible value it exists to deliver"
  NOT_VALIDATED:   "wired/deployed but NO production evidence of user value yet"
  SHADOW_INERT:    "a shadow/secondary track exists but produces nothing in observed prod data"
  BLOCKED:         "blocked on a dependency or gate (e.g. flag-gated off)"
  PARTIAL:         "some but not all of the field's criterion is met (see subtracks)"
  NONE:            "not applicable / nothing in production"

# ── Stale claims corrected (E): history preserved; CURRENT state corrected ────
corrected_current_claims:
  - claim: "Phase 1 COMPLETE / product functional for end users"
    where: "CANONICAL C2PRO_MASTER_BACKLOG.md lines 11-13 (main) — NOT only worktrees/archive"
    truth: "P0a reliability/operability baseline CLOSED; product value (Health/findings/alerts/reporting) NOT delivered. Legacy master now carries a COLD-REFERENCE banner (E) pointing here."
  - claim: "All 18 ADRs ratified / zero unimplemented decisions"
    where: "CANONICAL C2PRO_MASTER_BACKLOG.md lines 15-17 (main)"
    truth: "ADRs are ACCEPTED as design, not realized (see adr_realization). The '18-ADR audit' predates ADR-023/024 (added 2026-08-22) and conflates 3 ADR namespaces (see adr_namespaces). Primary-surface ADR-018 is WIRED-not-validated; ADR-024 is now WIRED (L4-1..L4-3 merged) but NOT deployed/validated."
  - claim: "No open code work required for end users"
    where: "Phase 1 Completion Certificate framing (main)"
    truth: "Single-document activation (ADR-024 -> ADR-018) is PARTIALLY built: the backend assessment path is merged (L4-1..L4-3), while per-clause evidence granularity, L4-4 API acceptance and L4-5 UI/prod validation remain open. P0b is a vertical product epic, not done. Plus Coherence v2 cutover, Change-Impact wedge, Alerts/HITL, Procurement, Reporting."

# ── ADR namespaces (F): THREE overlapping numberings exist — disambiguated ────
adr_namespaces:
  v3_canon:      "docs/architecture/decisions/ADR-004,009,013..024 — C2Pro v3.0 spine (Time/Change/Health/Evidence/Action)"
  foundational:  "docs/architecture/decisions/001..006 — platform decisions (modular-monolith, supabase, ai-arch, frontend-rules, test-strategy, post-reorg)"
  coherence_era: "docs/architecture/adr/ADR-001..003 — coherence dead-code/versioning/alert-ledger (older; superseded by v3-canon ADR-009)"
  collisions:
    - "ADR-004 is BOTH decisions/004-frontend-layer-rules AND decisions/ADR-004-circuit-breakers"
    - "ADR-001..003 mean different things in decisions/foundational vs adr/coherence-era vs the backlog's own 'Phase 1' audit"
  defect_ref: D8

