  - {adr: "002-supabase-mvp", ns: foundational, priority: P0, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "Supabase PG17 RLS multi-tenant live (tcxedmnvebazcsaridge)", gap: none}
  - {adr: "003-ai-architecture", ns: foundational, priority: P0, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "core/ai LLM client/router/prompt-cache/usage; Claude calls in prod", gap: none}
  - {adr: "004-frontend-layer-rules", ns: foundational, priority: P1, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "Next.js server/client boundaries; TanStack Query single client-state", gap: "NUMBER COLLIDES with ADR-004 circuit-breakers"}
  - {adr: "005-three-layer-test-strategy", ns: foundational, priority: P1, design_status: Accepted, realization_status: DEPLOYED, deployment_status: NONE, prod_validation_status: PROD_VALIDATED, evidence: "CI runs unit(Vitest/pytest)+integration(MSW)+E2E(Playwright)", gap: none}
  - {adr: "006-post-reorg-architecture", ns: foundational, priority: P1, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "monorepo apps/api+apps/web; demo/prod separation gates", gap: none}
  # coherence-era (adr/ADR-001..003)
  - {adr: "ADR-001-coherence-deadcode", ns: coherence_era, priority: P2, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "dead coherence code deleted; applied", gap: "historical; superseded by ADR-009"}
  - {adr: "ADR-002-coherence-score-versioning", ns: coherence_era, priority: P0, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "score_version enum live; 15/15 prod rows = 'coherence-v1'", gap: none}
  - {adr: "ADR-003-coherence-alert-ledger", ns: coherence_era, priority: P1, design_status: Accepted, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "coherence_results.alerts + alerts-table mirror live", gap: none}
  # v3-canon (decisions/ADR-*)
  - {adr: "ADR-004-circuit-breakers", ns: v3_canon, priority: P0, design_status: Implemented, realization_status: DEPLOYED, deployment_status: DEPLOYED, prod_validation_status: PROD_VALIDATED, evidence: "core/resilience + llm_client; 'circuit_breaker_registered service=anthropic_llm' in prod", gap: "NUMBER COLLIDES with 004-frontend-layer-rules"}
  - adr: "ADR-009-coherence"
    ns: v3_canon
    priority: P1
    design_status: Accepted
    design_note: "v2-locked; DEMOTED 2026-08-22 to the relational Contract subscore (not the primary surface)"
