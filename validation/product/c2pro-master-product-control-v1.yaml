  foundational:    "docs/architecture/decisions/001..006 — platform decisions (modular-monolith, supabase, ai-arch, frontend-rules, test-strategy, post-reorg)"
  coherence_era:   "docs/architecture/adr/ADR-001..003 — coherence dead-code/versioning/alert-ledger (older; superseded by v3-canon ADR-009)"
  collisions:
    - "ADR-004 is BOTH decisions/004-frontend-layer-rules AND decisions/ADR-004-circuit-breakers"
    - "ADR-001..003 mean different things in decisions/foundational vs adr/coherence-era vs the backlog's own 'Phase 1' audit (Modular Monolith/Supabase/AI)"
  defect_ref: D8

