north_star:
  full_product: >
    C2Pro is continuous, evidence-backed project and procurement intelligence for
    construction/infrastructure contracts: evidence intake; one canonical hierarchical WBS;
    Project Controls linking budget, schedule, deliverables, stakeholders/RACI and procurement;
    Health, relational Coherence, Change/Time intelligence, Alerts/Actions/HITL; procurement
    workflows (Plan/RfQ/BoQ/bid/award/comms); and executive/portfolio reporting. Every surface
    is evidence-backed and honest: Unknown renders null, never a fabricated zero/green.
  current_product_wedge_id: P0b-single-document-health-activation
  current_product_wedge: >
    P0b — Single-document Health activation (ADR-024 -> ADR-018): value from document #1
    through six-category coverage, intrinsic findings, missing_data, gap alerts and Health Vector.
    It is the entry point to the North Star, not the complete product.
  canonical_project_model: >
    ONE canonical hierarchical WBS per project. Discipline structures are branches/levels of that
    WBS, never independent WBSs. Budget, Schedule, Procurement, Stakeholders/RACI, Alerts,
    Evidence and Changes reference WBS nodes or an explicit project-level scope.

product_semantics:
  canonical_dimensions: [SCOPE, BUDGET, TIME, TECHNICAL, LEGAL, QUALITY]
  health: >
    Evidence-backed view of whether the project state can be assessed and, where supported,
    how dimensions are performing. Missing evidence is Unknown/null, never zero.
  coherence: >
    Visual consistency signal over reconcilable evidence. It is not Health and not alert severity.
    Unsupported dimensions are Unknown/null and coverage must be disclosed. A project can be
    highly coherent and still have a critical alert if the evidence consistently proves a problem.
  alerts:
    category_contract: "category MUST be one of the six canonical dimensions"
    trigger_contract: "trigger is orthogonal: deadline|deviation|contradiction|missing_evidence|material_change|other"
    minimum_context: "expected vs observed + evidence refs when available + WBS node when work-package-specific"
    visibility_priority: P1
    actions_hitl_priority: P2
  rollup: >
    Project/WBS roll-ups must be evidence- and coverage-aware. Never blindly average children and
    never convert Unknown to zero. Material critical leaf conditions must remain visible at parent/project level.

project_controls_model:
  adr: ADR-025
  priority: P1
  invariant: "one_project_one_canonical_hierarchical_wbs"
  existing_partial_evidence:
    - "wbs_nodes is the application-authoritative project-scoped nested-set hierarchy; runtime writes to procurement_wbs_items/wbs_items are blocked"
    - "ADR-025 migrations classify legacy rows without silent loss and preserve canonical mapping provenance"
    - "stakeholder_wbs_raci and procurement_bom_items foreign keys reference wbs_nodes; MCP v_project_wbs/v_raci_matrix read the canonical table"
    - "schedule clauses and project spend are derived from canonical WBS data on main"
    - "WBS nodes carry evidence lineage, planned/actual dates and budget fields"
  not_yet_proven:
    - "database/domain invariant enforcing exactly one logical root per project under every write path"
    - "baseline/change governance for the WBS"
    - "complete Budget allocation and hierarchical roll-up contract"
    - "full Schedule activity/milestone linkage beyond WBS-native planned/actual dates"
    - "Stakeholder/RACI escalation/ownership behavior beyond the canonical foreign-key linkage"
    - "Procurement packages -> WBS linkage without creating another WBS"
    - "Alerts/Evidence/Changes -> WBS node linkage and user drill-down"
    - "production user journey proving the complete cross-domain Project Controls backbone"
  downstream_dependency: >
    Procurement Plan, BoQ/RFQ, stakeholder communications and richer automation are downstream
    of this backbone. They must consume the canonical WBS rather than introduce a parallel structure.

status_vocabulary:
  DESIGNED: "ADR/spec accepted; no production code path"
  SCAFFOLDED: "code/module exists; not wired end-to-end"
  WIRED: "wired in the running app; not production-validated for user value"
  DEPLOYED: "running in production"
  PROD_VALIDATED: "production evidence of the user-visible value it exists to deliver"
  NOT_VALIDATED: "wired/deployed but no production evidence of user value yet"
  SHADOW_INERT: "shadow/secondary track exists but produces nothing in observed production data"
  BLOCKED: "blocked on a dependency or gate"
  PARTIAL: "some but not all of the criterion is met"
  NONE: "not applicable / nothing in production"

