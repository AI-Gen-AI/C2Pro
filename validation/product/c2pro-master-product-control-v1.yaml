    gap: "v2 global authoritative cutover NOT demonstrated"
  - {adr: "ADR-013-typed-graph", ns: v3_canon, priority: P0, design_status: Accepted, realization_status: WIRED, deployment_status: DEPLOYED, prod_validation_status: PARTIAL, evidence: "v3 thin-spine complete 2026-06-19; NodeResult/NodeStatus", gap: "residual 017-06"}
