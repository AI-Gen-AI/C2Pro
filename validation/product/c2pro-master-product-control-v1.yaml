    plane: ACT-HEALTH
    level: L2
    name: "P0b — Single-document Health activation (VERTICAL epic; decomposed to L4)"
    priority: P0b
    deps: []
    adrs: [ADR-024, ADR-018, ADR-022]
    user_value: "Value from document #1: per-category coverage + intrinsic findings + missing_data + gap alerts + Health Vector"
    realization_status: DESIGNED
    exit_gate: "P0b-L4-5 PROD_VALIDATED (see p0b_vertical_contract.done_definition)"
    evidence_for_done: "upload one doc in prod -> UI shows per-category {state,findings,missing_data} + gap alerts + Health Vector; Unknown=Insufficient-evidence, never 0%"
    children: [P0b-L4-1, P0b-L4-2, P0b-L4-3, P0b-L4-4, P0b-L4-5]
