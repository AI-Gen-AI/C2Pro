p0b_vertical_contract:
  invariant_ids: [INV-1, INV-UX, INV-COH]
  next_slice: null
  done_definition: >
    Production evidence: upload ONE document -> six-category decomposition -> per-category
    {state, findings, missing_data} -> actionable gap alerts -> Health Vector -> persisted + read
    via API -> user-visible UI/report. Unknown => null (never fabricated zero/green).
    Coherence unavailable as a headline until >=2 reconcilable documents.
  invariants:
    - "INV-1 honest-null: no category PRESENT/green without supporting evidence"
    - "INV-UX: backend null renders Unknown / Insufficient evidence, never 0%"
    - "INV-COH: relational Coherence stays NULL while <2 reconcilable documents exist"
    - "Reuse CoherenceCategory SCOPE/BUDGET/TIME/TECHNICAL/LEGAL/QUALITY"
  slices:
    - {id: P0b-L4-1, name: "category_coverage domain", scope: "compute category coverage + gap alerts", exit_gate: "unit invariants green", slice_status: DONE}
    - {id: P0b-L4-2, name: "wire intake -> classification -> coverage", scope: "real clauses -> category assessments + missing_data", exit_gate: "real document coverage integration green", slice_status: DONE}
    - {id: P0b-L4-3, name: "persist assessment into Health Vector", scope: "versioned assessment + lineage + snapshot", exit_gate: "round-trip/replay/honest-null green", slice_status: DONE}
    - {id: P0b-L4-4, name: "read API", scope: "authenticated GET health contract", exit_gate: "#581 acceptance incl. tenant isolation", slice_status: DONE}
    - {id: P0b-L4-5, name: "user-visible UI/report", scope: "six categories + findings + gaps + granularity + honest null; release-ready implementation merged via #630", exit_gate: "PROD upload -> user-visible truthful Health journey", slice_status: DONE}
  residuals:
    - id: P0b-R1-EVIDENCE-GRANULARITY
      name: "per-clause evidence granularity"
      status: RESOLVED
      priority: P0
      blocking: NON_BLOCKING
      resolved_by: "PR #579 (squash) — merge SHA 6d3a19e41f169d974e9a0d4ea73d1aec7c0bc4cc"
      historical_truth: "REGISTERED as a pre-UI gate and DID block P0b-L4-5 until per-clause evidence identity was delivered."
      resolution_evidence: "persisted documents.clauses UUID evidence identity reused; no second parser"
      no_longer_blocks: "P0b-L4-5"
    - id: P0b-R2-CROSS-DATA-CONTRACT
      name: "CROSS evaluator data-key contract"
      status: PLANNED
      priority: P1
      blocking: NON_BLOCKING
      production_truth: "cross-pairs are structurally possible but metadata vocabularies remain misaligned"
      required_resolution: "one truthful ingestion/evaluator metadata contract; no fabricated aliases"
      not_in_exit_gate: "outside P0b exit gate"
  p0b_exit_gate: "P0b-L4-5 PROD_VALIDATED with the done_definition evidence."

