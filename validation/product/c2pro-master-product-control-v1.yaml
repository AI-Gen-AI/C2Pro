# ── P0b vertical contract (define ALL slices + exit gates BEFORE slice 1) ──────
p0b_vertical_contract:
  done_definition: >
    Production evidence: upload ONE document -> six-category decomposition ->
    per-category {state, findings, missing_data} -> actionable gap alerts ->
    Health Vector -> persisted + read via API -> user-visible UI/report.
    Unknown => null (never fabricated zero/green). Contract/Documentation produce
    evidence-backed values when the source supports them; unsupported dimensions
    explain exactly what is missing. Coherence unavailable as a headline until >=2 docs.
  invariants:
    - "INV-1 honest-null: no category PRESENT/green without supporting evidence"
    - "INV-UX (I): backend null -> UI renders 'Unknown / Insufficient evidence' and NEVER 0%; 0 is valid ONLY when an evidence-backed scorer genuinely returns zero"
    - "INV-COH: coherence_subscore stays NULL while <2 reconcilable documents exist; relational Coherence is never a single-doc headline"
    - "Reuse CoherenceCategory (SCOPE/BUDGET/TIME/TECHNICAL/LEGAL/QUALITY) + HealthNullReason.INSUFFICIENT_EVIDENCE"
  slices:
    - {id: P0b-L4-1, name: "category_coverage domain (pure)", scope: "compute_category_coverage() + gap_alerts(); PRESENT|INSUFFICIENT_EVIDENCE; per-category action map", files_new: ["apps/api/src/health/domain/category_coverage.py", "apps/api/tests/unit/health/test_category_coverage.py"], exit_gate: "RED->GREEN unit: covered=PRESENT; absent=INSUFFICIENT_EVIDENCE + correct gap alert; all-present=0 gaps; empty=6 gaps; INV-1; ruff+mypy-ratchet green", status: proposed}
    - {id: P0b-L4-2, name: "wire single-doc intake -> classification -> coverage", scope: "one document's classified clauses -> per-category {state, findings(ADR-022 + intrinsic), missing_data}", exit_gate: "integration: real doc -> coverage object with findings + missing_data; contract-only => TECHNICAL/BUDGET/TIME insufficient", status: planned}
    - {id: P0b-L4-3, name: "assemble Health Vector from coverage + persist (Contract/Documentation ONLY)", scope: "feed Contract + Documentation HealthSignals from single-doc coverage; snapshot persist. Does NOT populate coherence_subscore (stays NULL for 1 doc). Coherence becomes a Contract input only once >=2 reconcilable documents exist (eligibility-gated).", exit_gate: "HealthVector persisted with honest-null dims; coherence_subscore=NULL asserted for single-doc; no fabricated composite", status: planned}
    - {id: P0b-L4-4, name: "read API", scope: "GET project health returns per-category decomposition + gap alerts + Health Vector", exit_gate: "authenticated GET returns decomposition+gaps+vector; Unknown=null in payload (never 0)", status: planned}
    - {id: P0b-L4-5, name: "user-visible UI/report", scope: "per-category view + gap alerts on document/health surface; null renders 'Unknown / Insufficient evidence'", exit_gate: "PROD: upload one doc -> UI shows per-category state/findings/missing_data + actionable gap alerts + Health Vector; Unknown!=0%; Coherence absent until >=2 docs", status: planned}
