sonar.exclusions=apps/web/lib/api/generated/**
# Duplication exclusions are for files that are generated, and therefore
# duplicate their source by construction. Detecting "duplication" in them
# reports the generator working correctly.
#   - apps/web/lib/api/generated/**: generated API client.
#   - supabase/migrations/20260902000100_p0_sec_a_data_api_containment.sql:
#     projected from the canonical Alembic migration by
#     apps/api/scripts/generate_p0_sec_a_mirror.py; parity with its source is
#     enforced by apps/api/tests/security/test_p0_sec_a_containment.py.
sonar.cpd.exclusions=apps/web/lib/api/generated/**,supabase/migrations/20260902000100_p0_sec_a_data_api_containment.sql
