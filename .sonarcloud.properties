# C2Pro — SonarQube Cloud canonical analysis scope
#
# Principles:
# - analyse production and operational code;
# - classify tests as test code rather than production;
# - exclude generated output, documentation/data artifacts and retired paths;
# - do not reduce scope merely to satisfy a LOC limit.

# Repository-wide roots are required because C2Pro contains backend,
# frontend, CI, infrastructure and operational code in several roots.
sonar.sources=.
sonar.tests=.

# Runtime language baseline
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Test classification.
# This includes dedicated test trees plus colocated frontend/Python tests.
sonar.test.inclusions=\
apps/api/tests/**/*,\
apps/web/__tests__/**/*,\
apps/web/tests/**/*,\
apps/web/src/tests/**/*,\
tests/**/*,\
supabase/tests/**/*,\
**/*.test.ts,\
**/*.test.tsx,\
**/*.test.js,\
**/*.test.jsx,\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.spec.js,\
**/*.spec.jsx,\
**/test_*.py,\
**/*_test.py

# Non-production artifacts.
#
# docs/** includes datasets such as ABENGOA_PROJECTS_DB.json.
# apps/web/schema/api.json is a contract artifact, not runtime source.
# supabase/migrations/** is a retired legacy migration authority.
# infrastructure/supabase/archive/** is reference/compatibility history.
sonar.exclusions=\
docs/**,\
apps/web/lib/api/generated/**,\
apps/web/schema/api.json,\
apps/web/.vitest-*.json,\
blackboard.json,\
pnpm-lock.yaml,\
context/**,\
evidence/**,\
supabase/migrations/**,\
infrastructure/supabase/archive/**,\
**/node_modules/**,\
**/.next/**,\
**/dist/**,\
**/coverage/**

# Generated/projected files must not affect duplication metrics.
sonar.cpd.exclusions=\
apps/web/lib/api/generated/**,\
supabase/migrations/20260902000100_p0_sec_a_data_api_containment.sql
