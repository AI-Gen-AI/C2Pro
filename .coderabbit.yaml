# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# DEV-16 pilot policy:
# - advisory only;
# - no merge authority;
# - no request-changes workflow;
# - no CodeRabbit commit status;
# - manual review during benchmark before any automatic rollout.

language: "en-US"
early_access: false

tone_instructions: >-
  Be concise and evidence-based. Report only concrete PR-introduced risks.
  Prioritize correctness, security, tenant isolation, idempotency, provenance,
  fail-closed behavior, and regression risk. Avoid duplicating lint/type/style findings.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: false
  review_progress: false
  commit_status: false
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: false

  path_filters:
    - "!docs/api/openapi.yaml"
    - "!pnpm-lock.yaml"
    - "!apps/web/public/mockServiceWorker.js"
    - "!**/*.snap"
    - "!**/generated/**"
    - "!graphify-out/**"
    - "!context/**"
    - "!sandbox/**"

  path_instructions:
    - path: "**/*"
      instructions: |-
        Review the diff adversarially against the PR objective and the repository's canonical guidance.
        Treat an external-review finding as advisory evidence only.
        Focus on defects introduced by this PR, not pre-existing cleanup opportunities.
        Flag hidden second sources of truth, duplicated authority, stale compatibility paths, silent fallback,
        missing negative tests, and changes that broaden authority without explicit policy.

    - path: "apps/api/**"
      instructions: |-
        Backend is multi-tenant and evidence-governed.
        Check tenant_id propagation, PostgreSQL RLS assumptions, authorization boundaries, transactionality,
        idempotency, bounded retries, concurrency/fencing, and fail-closed behavior.
        Missing evidence must remain unknown/null rather than being converted to zero, green, success, or fabricated facts.
        AI-produced state must preserve provenance and must not silently bypass HITL, approval, or trusted-state gates.

    - path: "apps/web/**"
      instructions: |-
        Check that UI state truthfully represents backend lifecycle state and authorization.
        Flag fabricated certainty, stale optimistic state, unsafe client-side authority, auth bypasses,
        hidden retry loops, and UI behavior that can present pending/unknown evidence as complete or safe.

    - path: ".github/**"
      instructions: |-
        Treat GitHub Actions as a supply-chain and governance surface.
        Check least-privilege permissions, pinned external actions, secret exposure, pull_request_target risk,
        concurrency semantics, path-filter effects on required checks, and any change that could make a required gate disappear.

    - path: ".c2pro/**"
      instructions: |-
        This is a governed development-control plane, not product runtime.
        Flag contradictions between canonical control files, weakened review policy, stale-head acceptance,
        or any change that grants a worker/reviewer more authority than the control model allows.
        Do not infer that a CodeRabbit review can authorize merge or trusted-state mutation.

  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false

  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

chat:
  auto_reply: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "docs/DOCUMENTATION_AUTHORITY.md"
