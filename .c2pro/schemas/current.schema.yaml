$schema: https://json-schema.org/draft/2020-12/schema
$id: c2pro-current-v1
type: object
additionalProperties: false
required:
  - schema
  - schema_version
  - repository
  - control_status
  - canonical_plan
  - baseline
  - active_work
  - next_eligible_work
  - authority
  - merge_policy
  - history
  - legacy
  - context_budget
properties:
  schema: {const: c2pro-current-v1}
  schema_version: {const: 1}
  repository: {type: string, minLength: 1}
  control_status: {enum: [transition, active, suspended]}
  canonical_plan:
    type: object
    additionalProperties: false
    required: [id, path]
    properties:
      id: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
  baseline:
    type: object
    additionalProperties: false
    required: [main_sha]
    properties:
      main_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
  active_campaign: {type: [string, 'null']}
  active_work:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  next_eligible_work: {type: [string, 'null']}
  authority:
    type: object
    additionalProperties: {type: boolean}
    required:
      - direct_main_mutation
      - production_runtime
      - secrets_or_credentials
      - destructive_data_action
      - architecture_change_outside_plan
  merge_policy:
    type: object
    additionalProperties: false
    required: [initial_mode]
    properties:
      initial_mode: {const: human_merge}
  history:
    type: object
    additionalProperties: false
    required: [primary, completed_work_in_hot_state]
    properties:
      primary:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      completed_work_in_hot_state: {const: false}
  legacy:
    type: object
    additionalProperties: false
    required: [compatibility_policy, blackboard_canonical, markdown_backlogs_canonical]
    properties:
      compatibility_policy: {type: string, minLength: 1}
      blackboard_canonical: {const: false}
      markdown_backlogs_canonical: {const: false}
  context_budget:
    type: object
    additionalProperties: false
    required: [bootstrap_hot_max_bytes, bootstrap_hot_paths]
    properties:
      bootstrap_hot_max_bytes: {type: integer, minimum: 1024, maximum: 32768}
      bootstrap_hot_paths:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
