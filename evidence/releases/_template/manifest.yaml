# Release Manifest Template
# See docs/internal/RELEASE_SIGNOFF_POLICY.md for threshold definitions

release_id: "<YYYY-MM-DD-rc#>"
commit_sha: "<40-char-git-sha>"
promotion_workflow: ".github/workflows/release.yml"
release_type: standard  # mvr | standard | ga

# Minimum thresholds (from RELEASE_SIGNOFF_POLICY.md)
thresholds:
  unit_coverage_min: 70
  security_coverage_min: 60
  integration_pass_rate_min: 95
  frontend_e2e_pass_rate_min: 90
  golden_pass_rate_min: 90
  coherence_accuracy_min: 75
  extraction_f1_min: 75
  retrieval_mrr_min: 65

required_suites:
  backend:
    workflow: ".github/workflows/ci.yml"
    status: pending  # pass | failure | pending
    artifact: "<run-id> - backend-release-summary (artifact <id>) - <url>"
    jobs:
      ci_status: pending
      unit_tests: pending
      integration_tests: pending
      security_suite: pending
      combined_coverage: pending
    coverage: null  # percentage when available
    note: ""

  frontend:
    workflow: ".github/workflows/ci.yml"
    status: pending
    artifact: "<run-id> - frontend-release-summary (artifact <id>) - <url>"
    jobs:
      ci_status: pending
      typecheck_lint: pending
      tests_api_drift: pending
      e2e_smoke: pending
      production_build: pending
    note: ""

  security:
    workflow: ".github/workflows/secret-scan.yml + .github/workflows/ci.yml"
    status: pending
    artifact: "<run-id/check-run refs> - gitleaks + backend security evidence - <url(s)>"
    coverage: null
    note: "Record exact gitleaks and affected CI security checks for the release commit."

  evaluation:
    workflow: ".github/workflows/evaluation-regression.yml"
    status: pending
    artifact: "<run-id> - evaluation-release-summary (artifact <id>) - <url>"
    metrics:
      coherence_accuracy: null
      extraction_f1: null
      retrieval_mrr: null
      golden_pass_rate: null
    note: ""

  reliability:
    workflow: ".github/workflows/i13-real-e2e-scheduled.yml"
    status: pending  # validator requires PASS whenever a Gate 7 bundle is supplied
    artifact: "<run-id> - i13 release-candidate evidence (artifact <id>) - <url>"
    mode: release-dispatch
    note: "If reliability evidence is not required for a release class, omit the Gate 7 bundle or revise the validator/policy through a separate governed change; do not mark an included required suite not_required."

swagger_workbook:
  status: pending  # pending | complete | partial
  reference: "docs/internal/SWAGGER_ENDPOINT_WORKBOOK.md"
  report: "swagger-verification.md"
  unchecked_items: []

manual_signoff:
  product: pending      # pending | approved | waived
  security: pending
  operations: pending
  release_authority: pending

performance:
  target_set: "docs/performance/baseline.md"
  result: pending  # pending | pass | failure | waived
  report: "performance.md"

dr_evidence:
  result: pending
  report: "disaster-recovery.md"

# Waivers for non-blocking failures
# See RELEASE_SIGNOFF_POLICY.md for waiver process
waivers: []
# Example waiver:
# - suite: integration_tests
#   failure: "2 flaky tests in test_concurrent_uploads"
#   risk_level: LOW
#   mitigation: "Tests are quarantined, manual verification passed"
#   owner: "@developer"
#   approved_by: "@tech-lead"
#   expires: "2026-04-15"
#   ticket: "https://github.com/org/repo/issues/123"
